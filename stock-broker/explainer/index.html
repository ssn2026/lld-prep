<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Stock Broker — Step Through the Code</title>
<style>
  :root {
    --paper:#e6e8ea; --surface:#f6f7f7; --surface-2:#eceeef;
    --ink:#14171a; --ink-dim:#565d61; --ink-faint:#878d90;
    --line:#c7cbcd; --line-strong:#a8adaf;
    --amber:#e0982f; --amber-strong:#c67f1e; --amber-glow:rgba(224,152,47,.5); --on-amber:#1a1206;
    --open:#3f8f63; --open-fill:#dcece2; --taken:#b6503f; --taken-fill:#f3ddd8;
    --shadow:0 1px 2px rgba(20,23,26,.08),0 14px 34px rgba(20,23,26,.1);
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --paper:#14171a; --surface:#1c2024; --surface-2:#22262a;
      --ink:#eef1f2; --ink-dim:#9aa1a5; --ink-faint:#6c7377;
      --line:#33393d; --line-strong:#454c50;
      --amber:#eaa53c; --amber-strong:#f5b657; --amber-glow:rgba(234,165,60,.45); --on-amber:#1a1206;
      --open:#5cb37e; --open-fill:#1c2b23; --taken:#d97764; --taken-fill:#2e211e;
      --shadow:0 1px 2px rgba(0,0,0,.4),0 14px 34px rgba(0,0,0,.3);
    }
  }
  :root[data-theme="dark"] {
    --paper:#14171a; --surface:#1c2024; --surface-2:#22262a;
    --ink:#eef1f2; --ink-dim:#9aa1a5; --ink-faint:#6c7377;
    --line:#33393d; --line-strong:#454c50;
    --amber:#eaa53c; --amber-strong:#f5b657; --amber-glow:rgba(234,165,60,.45); --on-amber:#1a1206;
    --open:#5cb37e; --open-fill:#1c2b23; --taken:#d97764; --taken-fill:#2e211e;
    --shadow:0 1px 2px rgba(0,0,0,.4),0 14px 34px rgba(0,0,0,.3);
  }
  * { box-sizing:border-box; }
  body { margin:0; background:var(--paper); color:var(--ink); font-family:-apple-system,'Segoe UI',Arial,sans-serif; padding:24px 16px 60px; }
  .mono { font-family:ui-monospace,'Cascadia Code','SF Mono',Consolas,monospace; font-variant-numeric:tabular-nums; }
  button { font-family:inherit; }
  *:focus-visible { outline:2px solid var(--amber-strong); outline-offset:2px; }
  h1 { font-size:20px; font-weight:800; margin:0 0 4px; }
  .wrap { max-width:1080px; margin:0 auto; }
  .eyebrow { font-size:11px; font-weight:800; letter-spacing:.1em; text-transform:uppercase; color:var(--ink-faint); margin-bottom:16px; }

  .layout { display:grid; grid-template-columns:1fr 1fr; gap:16px; align-items:start; }
  @media (max-width:820px){ .layout{ grid-template-columns:1fr; } }

  .card { background:var(--surface); border:1px solid var(--line); border-radius:16px; box-shadow:var(--shadow); padding:24px; }
  .stage-cap { font-size:13.5px; color:var(--ink-dim); margin:2px 0 18px; min-height:18px; }

  .choice-row { display:flex; gap:10px; flex-wrap:wrap; }
  .choice-btn { flex:1; min-width:150px; display:flex; flex-direction:column; align-items:flex-start; gap:4px; padding:12px 14px; background:var(--paper); border:1.5px solid var(--line-strong); border-radius:12px; cursor:pointer; text-align:left; }
  .choice-btn:hover:not(:disabled) { border-color:var(--amber); }
  .choice-btn.picked { border-color:var(--open); background:var(--open-fill); }
  .choice-btn.locked { opacity:.45; cursor:not-allowed; }
  .choice-btn:disabled { cursor:default; }
  .choice-btn .label { font-size:12.5px; font-weight:700; }
  .choice-btn .sub { font-size:10.5px; color:var(--ink-faint); }

  .floor { display:flex; flex-direction:column; gap:12px; margin:14px 0; }
  .price-ticker { display:flex; align-items:baseline; gap:10px; background:var(--surface-2); border:1.5px solid var(--line-strong); border-radius:12px; padding:12px 16px; }
  .price-ticker .sym { font-size:12px; font-weight:800; color:var(--ink-dim); letter-spacing:.05em; }
  .price-ticker .px { font-size:26px; font-weight:800; color:var(--amber-strong); }
  .accts { display:flex; gap:10px; flex-wrap:wrap; }
  .acct-card { flex:1; min-width:150px; background:var(--surface-2); border:1.5px solid var(--line-strong); border-radius:12px; padding:12px 14px; transition:border-color .3s; }
  .acct-card .acct-name { font-size:11px; font-weight:800; text-transform:uppercase; letter-spacing:.06em; color:var(--ink-faint); }
  .acct-card .acct-cash { font-size:18px; font-weight:800; margin-top:4px; }
  .acct-card .acct-holdings { font-size:11.5px; color:var(--ink-dim); margin-top:4px; }
  .pending-card { background:var(--surface-2); border:1.5px dashed var(--line-strong); border-radius:12px; padding:12px 14px; }
  .pending-head { font-size:11px; font-weight:800; text-transform:uppercase; letter-spacing:.06em; color:var(--ink-faint); margin-bottom:6px; }
  .pending-row { font-size:12px; padding:4px 0; border-top:1px solid var(--line); }
  .pending-row:first-child { border-top:none; }
  .pending-empty { font-size:12px; color:var(--ink-faint); }

  .charges-panel { background:var(--surface-2); border:1.5px solid var(--amber); border-radius:12px; padding:12px 14px; margin-top:4px; }
  .charges-row { display:flex; justify-content:space-between; font-size:12.5px; padding:3px 0; color:var(--ink-dim); }
  .charges-row.total { border-top:1px solid var(--line-strong); margin-top:4px; padding-top:6px; font-weight:800; color:var(--ink); }

  .reject-banner { background:var(--taken-fill); border:1.5px solid var(--taken); color:var(--taken); border-radius:10px; padding:10px 14px; font-size:12.5px; font-weight:700; }

  button.cta { padding:11px 20px; background:var(--amber); color:var(--on-amber); border:none; border-radius:999px; font-weight:800; font-size:13px; cursor:pointer; }
  button.cta:hover { background:var(--amber-strong); }
  button.cta.ghost { background:transparent; color:var(--ink-dim); border:1.5px solid var(--line-strong); }
  .actions { display:flex; gap:8px; justify-content:center; flex-wrap:wrap; margin-top:14px; }

  /* trace console */
  .trace-card { max-height:640px; overflow-y:auto; }
  .trace-head { display:flex; justify-content:space-between; align-items:baseline; margin-bottom:10px; }
  .trace-head .t { font-size:12px; font-weight:800; letter-spacing:.08em; text-transform:uppercase; color:var(--ink-dim); }
  .trace-log { display:flex; flex-direction:column; gap:10px; }
  .trace-divider { font-size:10.5px; font-weight:800; color:var(--amber-strong); letter-spacing:.06em; text-transform:uppercase; margin:8px 0 2px; border-top:1px dashed var(--line); padding-top:10px; }
  .trace-step { animation:fadeIn .35s ease; border-left:2.5px solid var(--amber); padding:2px 0 2px 10px; }
  @keyframes fadeIn { from{opacity:0; transform:translateY(4px);} to{opacity:1; transform:none;} }
  .trace-step .code { font-size:12.5px; font-weight:600; color:var(--ink); }
  .trace-step .detail { font-size:11.5px; color:var(--ink-faint); margin-top:2px; }
  .trace-empty { font-size:13px; color:var(--ink-faint); padding:10px 0; }
  @media (prefers-reduced-motion: reduce){ .trace-step{ animation:none; } }
</style>
</head>
<body>

<div class="wrap">
  <div class="eyebrow">Stock Broker · LLD-Prep</div>
  <div class="layout">
    <div class="card" id="stage"></div>
    <div class="card trace-card">
      <div class="trace-head"><span class="t">Live code trace</span><span class="mono" id="step-count" style="font-size:11px;color:var(--ink-faint)"></span></div>
      <div class="trace-log" id="trace-log"><div class="trace-empty">Tap an action on the left — every click logs the real StockBrokerService call it triggers.</div></div>
    </div>
  </div>
</div>

<script>
(function(){
"use strict";
var BROKERAGE_RATE = 0.0025, STT_RATE = 0.001, GST_RATE = 0.0005;
var PREREQ = { buy:null, limits:'buy', tick138:'limits', tick165:'tick138', reject:'tick165' };
var LABELS = {
  buy:    ['Alice: BUY 10 AAPL (MARKET)', 'executes instantly at the current price'],
  limits: ['Place 2 LIMIT orders', 'Alice SELL 5 @160, Bob BUY 20 @140 — neither executable yet'],
  tick138:['Price tick → $138.00', "triggers Bob's pending buy"],
  tick165:['Price tick → $165.00', "triggers Alice's pending sell"],
  reject: ['Alice: SELL 100 AAPL (MARKET)', 'rejected — she only holds 5']
};

function initialState(){
  return {
    price: 150.00,
    accounts: { alice:{cash:100000, holdings:{}}, bob:{cash:50000, holdings:{}} },
    pending: [],
    orderSeq: 1,
    lastCharges: null,
    rejectMsg: null,
    done: { buy:false, limits:false, tick138:false, tick165:false, reject:false }
  };
}
var state = initialState();

function esc(s){ return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }
function money(n){ return '$'+n.toFixed(2); }
function chargesFor(tradeValue){
  var brokerage = tradeValue*BROKERAGE_RATE, stt = tradeValue*STT_RATE, gst = tradeValue*GST_RATE;
  return { brokerage:brokerage, stt:stt, gst:gst, total:brokerage+stt+gst };
}
function holdingQty(acc, symbol){ return acc.holdings[symbol] || 0; }
function addHolding(acc, symbol, qty){ acc.holdings[symbol] = (acc.holdings[symbol]||0) + qty; }
function removeHolding(acc, symbol, qty){
  var r = (acc.holdings[symbol]||0) - qty;
  if (r<=0) delete acc.holdings[symbol]; else acc.holdings[symbol]=r;
}

// ---------- trace log ----------
function logDivider(text){
  var d=document.createElement('div'); d.className='trace-divider'; d.textContent=text;
  document.getElementById('trace-log').appendChild(d);
}
function logStep(codeLine, detail, effect){
  var log = document.getElementById('trace-log');
  var empty = log.querySelector('.trace-empty'); if (empty) empty.remove();
  var div = document.createElement('div'); div.className='trace-step';
  div.innerHTML = '<div class="code mono">'+esc(codeLine)+'</div><div class="detail">'+esc(detail)+'</div>';
  log.appendChild(div);
  div.scrollIntoView({block:'end', behavior:'smooth'});
  if (effect) effect();
}

// ---------- floor rendering ----------
function renderFloor(){
  var html = '<div class="floor">';
  html += '<div class="price-ticker"><span class="sym mono">AAPL</span><span class="px mono">'+money(state.price)+'</span></div>';
  html += '<div class="accts">'+['alice','bob'].map(function(id){
    var a=state.accounts[id];
    var keys=Object.keys(a.holdings);
    var hstr = keys.length ? keys.map(function(s){return s+': '+a.holdings[s];}).join(', ') : '— no holdings —';
    return '<div class="acct-card"><div class="acct-name">'+id+'</div><div class="acct-cash mono">'+money(a.cash)+'</div><div class="acct-holdings mono">'+esc(hstr)+'</div></div>';
  }).join('')+'</div>';
  html += '<div class="pending-card"><div class="pending-head">Pending limit orders</div>'+
    (state.pending.length
      ? state.pending.map(function(o){ return '<div class="pending-row mono">'+o.id+' &middot; '+o.accountId+' '+o.side+' '+o.qty+' '+o.symbol+' @'+o.limit.toFixed(2)+'</div>'; }).join('')
      : '<div class="pending-empty">No pending orders</div>')+
    '</div>';
  if (state.lastCharges){
    var c = state.lastCharges;
    html += '<div class="charges-panel"><div class="charges-row"><span>Trade value</span><span class="mono">'+money(c.tradeValue)+'</span></div>'+
      '<div class="charges-row"><span>+ Brokerage (0.25%)</span><span class="mono">'+money(c.charges.brokerage)+'</span></div>'+
      '<div class="charges-row"><span>+ STT (0.10%)</span><span class="mono">'+money(c.charges.stt)+'</span></div>'+
      '<div class="charges-row"><span>+ GST (0.05%)</span><span class="mono">'+money(c.charges.gst)+'</span></div>'+
      '<div class="charges-row total"><span>Total charges</span><span class="mono">'+money(c.charges.total)+'</span></div></div>';
  }
  if (state.rejectMsg){
    html += '<div class="reject-banner">'+esc(state.rejectMsg)+'</div>';
  }
  html += '</div>';
  return html;
}

// ---------- step builders ----------
function buildBuySteps(){
  var acc = state.accounts.alice, price = state.price, qty = 10, tradeValue = price*qty;
  var charges = chargesFor(tradeValue), id = 'O'+state.orderSeq;
  return [
    { code:'placeOrder("alice","AAPL",BUY,MARKET,10,null);', detail:'new Order("'+id+'",...); quantity>0 ✓, account exists ✓' },
    { code:'resolveStrategy(MARKET) → new MarketOrderStrategy();', detail:'picks the execution algorithm for this order type' },
    { code:'priceFeed.getCurrentPrice("AAPL");', detail:'adapter → ExternalMarketFeed.fetchQuote("AAPL").lastTradedPrice = '+money(price) },
    { code:'strategy.isExecutable(order, '+price.toFixed(2)+');', detail:'MarketOrderStrategy → always true' },
    { code:'chargeCalculator.totalCharges('+tradeValue.toFixed(2)+');',
      detail:'NoCharge(0.00) → +Brokerage('+charges.brokerage.toFixed(2)+') → +STT('+charges.stt.toFixed(2)+') → +GST('+charges.gst.toFixed(2)+') = '+charges.total.toFixed(2),
      effect:function(){ state.lastCharges = {tradeValue:tradeValue, charges:charges}; } },
    { code:'account.debit('+(tradeValue+charges.total).toFixed(2)+'); account.addHolding("AAPL", 10);',
      detail:'alice: cash '+money(acc.cash)+' → '+money(acc.cash-(tradeValue+charges.total))+', holdings AAPL: 0 → 10',
      effect:function(){ acc.cash -= (tradeValue+charges.total); addHolding(acc,'AAPL',10); } },
    { code:'order.markExecuted('+price.toFixed(2)+', '+charges.total.toFixed(2)+');', detail:'status PENDING → EXECUTED',
      effect:function(){ state.orderSeq++; state.done.buy = true; } }
  ];
}

function buildLimitsSteps(){
  var price = state.price;
  var aliceId = 'O'+state.orderSeq;
  var steps = [
    { code:'placeOrder("alice","AAPL",SELL,LIMIT,5,160.0);', detail:'new Order("'+aliceId+'",...); limitPrice provided ✓' },
    { code:'strategy.isExecutable(order, '+price.toFixed(2)+');', detail:'SELL limit: currentPrice('+price.toFixed(2)+') >= limitPrice(160.00)? → false' },
    { code:'orderRepository.save(order); // status stays PENDING', detail:aliceId+' SELL 5 AAPL @160.00 added to pending',
      effect:function(){ state.pending.push({id:aliceId, accountId:'alice', side:'SELL', qty:5, symbol:'AAPL', limit:160}); state.orderSeq++; } }
  ];
  var bobId = 'O'+state.orderSeq;
  steps.push(
    { code:'placeOrder("bob","AAPL",BUY,LIMIT,20,140.0);', detail:'new Order("'+bobId+'",...); limitPrice provided ✓' },
    { code:'strategy.isExecutable(order, '+price.toFixed(2)+');', detail:'BUY limit: currentPrice('+price.toFixed(2)+') <= limitPrice(140.00)? → false' },
    { code:'orderRepository.save(order); // status stays PENDING', detail:bobId+' BUY 20 AAPL @140.00 added to pending',
      effect:function(){ state.pending.push({id:bobId, accountId:'bob', side:'BUY', qty:20, symbol:'AAPL', limit:140}); state.orderSeq++; state.done.limits = true; } }
  );
  return steps;
}

function buildTickSteps(newPrice, flag){
  var steps = [
    { code:'publishPriceUpdate("AAPL", '+newPrice.toFixed(2)+');', detail:'a new tick arrives' },
    { code:'externalMarketFeed.publishQuote("AAPL", '+newPrice.toFixed(2)+');', detail:'the third-party feed records it',
      effect:function(){ state.price = newPrice; } },
    { code:'priceFeed.getCurrentPrice("AAPL") → '+newPrice.toFixed(2)+';', detail:'adapter reads the fresh tick straight back' }
  ];
  state.pending.slice().forEach(function(o){
    var executable = o.side==='BUY' ? newPrice<=o.limit : newPrice>=o.limit;
    var cmp = o.side==='BUY' ? '<=' : '>=';
    steps.push({ code:'strategy.isExecutable('+o.id+', '+newPrice.toFixed(2)+');',
      detail:o.side+' limit: '+newPrice.toFixed(2)+' '+cmp+' '+o.limit.toFixed(2)+'? → '+executable });
    if (executable){
      var acc = state.accounts[o.accountId], tradeValue = newPrice*o.qty, charges = chargesFor(tradeValue);
      steps.push({ code:'executeOrder('+o.id+', '+newPrice.toFixed(2)+');',
        detail:o.accountId+': '+(o.side==='BUY' ? 'debit '+money(tradeValue+charges.total) : 'credit '+money(tradeValue-charges.total))+', charges='+money(charges.total),
        effect:function(){
          if (o.side==='BUY'){ acc.cash -= (tradeValue+charges.total); addHolding(acc, o.symbol, o.qty); }
          else { removeHolding(acc, o.symbol, o.qty); acc.cash += (tradeValue-charges.total); }
          state.lastCharges = {tradeValue:tradeValue, charges:charges};
          state.pending = state.pending.filter(function(p){ return p.id!==o.id; });
        } });
    }
  });
  var last = steps[steps.length-1], origEffect = last.effect;
  last.effect = function(){ if (origEffect) origEffect(); state.done[flag] = true; };
  return steps;
}

function buildRejectSteps(){
  var acc = state.accounts.alice, held = holdingQty(acc,'AAPL'), price = state.price, id = 'O'+state.orderSeq;
  return [
    { code:'placeOrder("alice","AAPL",SELL,MARKET,100,null);', detail:'new Order("'+id+'",...) constructed — the id is consumed even though this order will fail' },
    { code:'strategy.isExecutable(order, '+price.toFixed(2)+');', detail:'MarketOrderStrategy → always true' },
    { code:'executeOrder(order, '+price.toFixed(2)+');', detail:'begins settling the trade' },
    { code:'account.getHoldingQuantity("AAPL") < order.getQuantity()', detail:'held='+held+', requested=100 → true',
      effect:function(){ state.orderSeq++; } },
    { code:'throw new InsufficientHoldingsException(\n  "Insufficient holdings of AAPL: requested 100, held '+held+'");',
      detail:'propagates out of placeOrder() — the order is NEVER saved to orderRepository',
      effect:function(){ state.rejectMsg = 'Rejected: InsufficientHoldingsException — requested 100, held '+held; state.done.reject = true; } }
  ];
}

var BUILDERS = { buy:buildBuySteps, limits:buildLimitsSteps, tick138:function(){ return buildTickSteps(138.00,'tick138'); },
  tick165:function(){ return buildTickSteps(165.00,'tick165'); }, reject:buildRejectSteps };

// ---------- screens ----------
function actionButton(key){
  var prereq = PREREQ[key], locked = prereq && !state.done[prereq], done = state.done[key];
  var lbl = LABELS[key][0], sub = locked ? 'locked — do the previous step first' : LABELS[key][1];
  var cls = 'choice-btn'+(done?' picked':'')+(locked?' locked':'');
  return '<button class="'+cls+'" data-action="'+key+'"'+((locked||done)?' disabled':'')+'>'+
    '<span class="label">'+(done?'✓ ':'')+esc(lbl)+'</span><span class="sub">'+esc(sub)+'</span></button>';
}

function screenHub(){
  var el = document.getElementById('stage');
  el.innerHTML = '<h1>Trading floor</h1>'+
    '<p class="stage-cap">Alice ($100,000) and Bob ($50,000) already have accounts; AAPL is trading at $150.00 to start.</p>'+
    '<div id="floor">'+renderFloor()+'</div>'+
    '<div class="choice-row" style="margin-top:14px">'+
      ['buy','limits','tick138','tick165','reject'].map(actionButton).join('')+
    '</div>'+
    '<div class="actions"><button class="cta ghost" id="reset">Reset demo ↻</button></div>';
  Array.prototype.forEach.call(el.querySelectorAll('[data-action]'), function(b){
    b.addEventListener('click', function(){
      var key = b.getAttribute('data-action');
      logDivider('— '+LABELS[key][0]+' —');
      screenSteps(BUILDERS[key](), screenHub);
    });
  });
  document.getElementById('reset').addEventListener('click', function(){
    state = initialState();
    logDivider('— Demo reset —');
    screenHub();
  });
}

function screenSteps(steps, onDone){
  var idx = 0;
  render();
  function render(){
    var el = document.getElementById('stage');
    el.innerHTML = '<h1>Watch it happen</h1><p class="stage-cap">Tap through the real call chain.</p>'+
      '<div id="floor">'+renderFloor()+'</div>'+
      '<div class="actions"><button class="cta" id="next-step">Next step →</button></div>';
    document.getElementById('next-step').addEventListener('click', function(){
      var s = steps[idx]; logStep(s.code, s.detail, s.effect); idx++;
      if (idx >= steps.length){ setTimeout(onDone, 350); } else { render(); }
    });
  }
}

screenHub();
})();
</script>
</body>
</html>
