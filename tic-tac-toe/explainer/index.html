<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Tic-Tac-Toe — Step Through the Code</title>
<style>
  :root {
    --paper:#e6e8ea; --surface:#f6f7f7; --surface-2:#eceeef;
    --ink:#14171a; --ink-dim:#565d61; --ink-faint:#878d90;
    --line:#c7cbcd; --line-strong:#a8adaf;
    --amber:#e0982f; --amber-strong:#c67f1e; --amber-glow:rgba(224,152,47,.5); --on-amber:#1a1206;
    --open:#3f8f63; --open-fill:#dcece2; --taken:#b6503f; --taken-fill:#f3ddd8;
    --shadow:0 1px 2px rgba(20,23,26,.08),0 14px 34px rgba(20,23,26,.1);
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --paper:#14171a; --surface:#1c2024; --surface-2:#22262a;
      --ink:#eef1f2; --ink-dim:#9aa1a5; --ink-faint:#6c7377;
      --line:#33393d; --line-strong:#454c50;
      --amber:#eaa53c; --amber-strong:#f5b657; --amber-glow:rgba(234,165,60,.45); --on-amber:#1a1206;
      --open:#5cb37e; --open-fill:#1c2b23; --taken:#d97764; --taken-fill:#2e211e;
      --shadow:0 1px 2px rgba(0,0,0,.4),0 14px 34px rgba(0,0,0,.3);
    }
  }
  :root[data-theme="dark"] {
    --paper:#14171a; --surface:#1c2024; --surface-2:#22262a;
    --ink:#eef1f2; --ink-dim:#9aa1a5; --ink-faint:#6c7377;
    --line:#33393d; --line-strong:#454c50;
    --amber:#eaa53c; --amber-strong:#f5b657; --amber-glow:rgba(234,165,60,.45); --on-amber:#1a1206;
    --open:#5cb37e; --open-fill:#1c2b23; --taken:#d97764; --taken-fill:#2e211e;
    --shadow:0 1px 2px rgba(0,0,0,.4),0 14px 34px rgba(0,0,0,.3);
  }
  * { box-sizing:border-box; }
  body { margin:0; background:var(--paper); color:var(--ink); font-family:-apple-system,'Segoe UI',Arial,sans-serif; padding:24px 16px 60px; }
  .mono { font-family:ui-monospace,'Cascadia Code','SF Mono',Consolas,monospace; font-variant-numeric:tabular-nums; }
  button { font-family:inherit; }
  *:focus-visible { outline:2px solid var(--amber-strong); outline-offset:2px; }
  h1 { font-size:20px; font-weight:800; margin:0 0 4px; }
  .wrap { max-width:1100px; margin:0 auto; }
  .eyebrow { font-size:11px; font-weight:800; letter-spacing:.1em; text-transform:uppercase; color:var(--ink-faint); margin-bottom:16px; }

  .layout { display:grid; grid-template-columns:1fr 1fr; gap:16px; align-items:start; }
  @media (max-width:820px){ .layout{ grid-template-columns:1fr; } }

  .card { background:var(--surface); border:1px solid var(--line); border-radius:16px; box-shadow:var(--shadow); padding:24px; }
  .stage-cap { font-size:13.5px; color:var(--ink-dim); margin:2px 0 14px; min-height:18px; }

  .status-row { display:flex; gap:8px; flex-wrap:wrap; margin-bottom:12px; }
  .status-chip { padding:5px 12px; border-radius:999px; background:var(--surface-2); border:1px solid var(--line); font-size:11.5px; font-weight:700; color:var(--ink-dim); }
  .status-chip.turn { border-color:var(--amber); color:var(--ink); }
  .winner-banner { text-align:center; font-size:14px; font-weight:800; color:var(--open); background:var(--open-fill); border:1.5px solid var(--open); border-radius:10px; padding:10px; margin-bottom:10px; }
  .winner-banner.draw { color:var(--ink-dim); background:var(--surface-2); border-color:var(--line-strong); }

  .grid3 { display:grid; grid-template-columns:repeat(3, 1fr); gap:6px; max-width:260px; margin:0 auto; }
  .gcell { aspect-ratio:1; border:1.5px solid var(--line-strong); border-radius:10px; background:var(--paper); display:flex; align-items:center; justify-content:center; font-size:30px; font-weight:800; cursor:pointer; color:var(--ink-dim); }
  .gcell.x { color:var(--amber-strong); }
  .gcell.o { color:#4a7fd6; }
  .gcell.empty:hover { border-color:var(--amber); }
  .gcell.disabled { cursor:not-allowed; }

  button.cta { padding:11px 20px; background:var(--amber); color:var(--on-amber); border:none; border-radius:999px; font-weight:800; font-size:13px; cursor:pointer; }
  button.cta:hover { background:var(--amber-strong); }
  button.cta.ghost { background:transparent; color:var(--ink-dim); border:1.5px solid var(--line-strong); }
  .actions { display:flex; gap:8px; justify-content:center; flex-wrap:wrap; margin-top:16px; }

  /* trace console */
  .trace-card { max-height:640px; overflow-y:auto; }
  .trace-head { display:flex; justify-content:space-between; align-items:baseline; margin-bottom:10px; }
  .trace-head .t { font-size:12px; font-weight:800; letter-spacing:.08em; text-transform:uppercase; color:var(--ink-dim); }
  .trace-log { display:flex; flex-direction:column; gap:10px; }
  .trace-divider { font-size:10.5px; font-weight:800; color:var(--amber-strong); letter-spacing:.06em; text-transform:uppercase; margin:8px 0 2px; border-top:1px dashed var(--line); padding-top:10px; }
  .trace-step { animation:fadeIn .35s ease; border-left:2.5px solid var(--amber); padding:2px 0 2px 10px; }
  @keyframes fadeIn { from{opacity:0; transform:translateY(4px);} to{opacity:1; transform:none;} }
  .trace-step .code { font-size:12.5px; font-weight:600; color:var(--ink); }
  .trace-step .detail { font-size:11.5px; color:var(--ink-faint); margin-top:2px; }
  .trace-empty { font-size:13px; color:var(--ink-faint); padding:10px 0; }
  @media (prefers-reduced-motion: reduce){ .trace-step{ animation:none; } }
</style>
</head>
<body>

<div class="wrap">
  <div class="eyebrow">Tic-Tac-Toe · LLD-Prep</div>
  <div class="layout">
    <div class="card" id="stage"></div>
    <div class="card trace-card">
      <div class="trace-head"><span class="t">Live code trace</span><span class="mono" id="step-count" style="font-size:11px;color:var(--ink-faint)"></span></div>
      <div class="trace-log" id="trace-log"><div class="trace-empty">Tap a cell to start — every click below logs the real method call it triggers.</div></div>
    </div>
  </div>
</div>

<script>
(function(){
"use strict";

var state = {
  grid: [['','',''],['','',''],['','','']],
  currentMark: 'X',
  status: 'IN_PROGRESS'
};

function esc(s){ return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }

// ---------- trace log ----------
function logDivider(text){
  var d=document.createElement('div'); d.className='trace-divider'; d.textContent=text;
  document.getElementById('trace-log').appendChild(d);
}
function logStep(codeLine, detail, effect){
  var log = document.getElementById('trace-log');
  var empty = log.querySelector('.trace-empty'); if (empty) empty.remove();
  var div = document.createElement('div'); div.className='trace-step';
  div.innerHTML = '<div class="code mono">'+esc(codeLine)+'</div><div class="detail">'+esc(detail)+'</div>';
  log.appendChild(div);
  div.scrollIntoView({block:'end', behavior:'smooth'});
  if (effect) effect();
}

function isFull(){
  for (var r=0;r<3;r++) for (var c=0;c<3;c++) if (state.grid[r][c]==='') return false;
  return true;
}
function checkWinner(row, col, mark){
  var rowWin=true, colWin=true;
  for (var i=0;i<3;i++){
    if (state.grid[row][i]!==mark) rowWin=false;
    if (state.grid[i][col]!==mark) colWin=false;
  }
  if (rowWin || colWin) return true;
  if (row===col){
    var d=true; for (var i2=0;i2<3;i2++) if (state.grid[i2][i2]!==mark) d=false;
    if (d) return true;
  }
  if (row+col===2){
    var ad=true; for (var i3=0;i3<3;i3++) if (state.grid[i3][2-i3]!==mark) ad=false;
    if (ad) return true;
  }
  return false;
}

// ---------- render fragments ----------
function renderStatusHTML(){
  var chip = '<span class="status-chip'+(state.status==='IN_PROGRESS'?' turn':'')+'">'+
    (state.status==='IN_PROGRESS' ? 'Turn: '+state.currentMark : 'Status: '+state.status)+'</span>';
  var banner = '';
  if (state.status==='X_WON' || state.status==='O_WON'){
    banner = '<div class="winner-banner">'+state.status.replace('_',' ')+'!</div>';
  } else if (state.status==='DRAW'){
    banner = '<div class="winner-banner draw">DRAW</div>';
  }
  return '<div class="status-row">'+chip+'</div>'+banner;
}
function renderGridHTML(clickable){
  var html = '<div class="grid3">';
  for (var r=0;r<3;r++){
    for (var c=0;c<3;c++){
      var v = state.grid[r][c];
      var cls = 'gcell '+(v==='X'?'x':v==='O'?'o':'empty')+(!clickable||v!==''?' disabled':'');
      html += '<div class="'+cls+'" data-r="'+r+'" data-c="'+c+'">'+v+'</div>';
    }
  }
  return html+'</div>';
}

// ---------- screens ----------
function buildMoveSteps(row, col){
  var mark = state.currentMark;
  var steps = [];
  steps.push({ code:'state.requireInProgress();', detail:'status = '+state.status+' -> legal, proceeds' });
  steps.push({ code:'board.isInBounds('+row+','+col+') && board.isEmpty('+row+','+col+');', detail:'both true' });
  steps.push({ code:'board.place('+row+', '+col+', '+mark+');', detail:mark+' placed at ('+row+','+col+')',
    effect:function(){ state.grid[row][col] = mark; } });
  steps.push({ code:'notifyMove('+mark+', '+row+', '+col+');', detail:'ConsoleGameListener notified (Observer)' });

  var won = checkWinner(row, col, mark);
  steps.push({ code:'winningStrategy.checkWinner(board, '+row+', '+col+', '+mark+');',
    detail: won ? 'true -- a full row/column/diagonal through ('+row+','+col+') is all '+mark : 'false -- no line completed yet' });

  if (won){
    steps.push({ code:'state = '+mark+' == X ? XWonState.INSTANCE : OWonState.INSTANCE;', detail:mark+' wins',
      effect:function(){ state.status = mark+'_WON'; } });
    steps.push({ code:'notifyGameOver('+mark+'_WON);', detail:'Observer fires the terminal event' });
  } else if (isFull()){
    steps.push({ code:'board.isFull();', detail:'true -- no winner, no cells left',
      effect:function(){ state.status = 'DRAW'; } });
    steps.push({ code:'state = DrawState.INSTANCE; notifyGameOver(DRAW);', detail:'game ends in a draw' });
  } else {
    steps.push({ code:'currentMark = currentMark == X ? O : X;', detail:'turn passes to '+(mark==='X'?'O':'X'),
      effect:function(){ state.currentMark = mark==='X' ? 'O' : 'X'; } });
  }
  return steps;
}

function screenMoveSteps(row, col){
  logDivider('— makeMove('+row+', '+col+') —');
  var steps=buildMoveSteps(row, col), idx=0;
  render();
  function render(){
    var el=document.getElementById('stage');
    el.innerHTML='<h1>service.makeMove('+row+', '+col+')</h1><p class="stage-cap">Tap through the real call chain.</p>'+
      renderStatusHTML()+renderGridHTML(false)+
      '<div class="actions"><button class="cta" id="next-step">Next step →</button></div>';
    document.getElementById('next-step').addEventListener('click', function(){
      var s=steps[idx]; logStep(s.code, s.detail, s.effect); idx++;
      if (idx>=steps.length){ setTimeout(screenBoard, 200); } else { render(); }
    });
  }
}

function screenBoard(){
  var el=document.getElementById('stage');
  var clickable = state.status==='IN_PROGRESS';
  el.innerHTML='<h1>Board</h1><p class="stage-cap">'+(clickable?'Tap an empty cell.':'Game over.')+'</p>'+
    renderStatusHTML()+renderGridHTML(clickable)+
    '<div class="actions"><button class="cta ghost" id="reset">New game ↻</button></div>';
  if (clickable){
    Array.prototype.forEach.call(el.querySelectorAll('.gcell.empty'), function(cell){
      cell.addEventListener('click', function(){
        screenMoveSteps(parseInt(cell.getAttribute('data-r'),10), parseInt(cell.getAttribute('data-c'),10));
      });
    });
  }
  document.getElementById('reset').addEventListener('click', function(){
    state = { grid:[['','',''],['','',''],['','','']], currentMark:'X', status:'IN_PROGRESS' };
    document.getElementById('trace-log').innerHTML='<div class="trace-empty">Tap a cell to start — every click below logs the real method call it triggers.</div>';
    screenBoard();
  });
}

screenBoard();
})();
</script>
</body>
</html>
