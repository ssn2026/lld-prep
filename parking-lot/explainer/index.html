<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Parking Lot — Step Through the Code</title>
<style>
  :root {
    --paper:#e6e8ea; --surface:#f6f7f7; --surface-2:#eceeef;
    --ink:#14171a; --ink-dim:#565d61; --ink-faint:#878d90;
    --line:#c7cbcd; --line-strong:#a8adaf;
    --amber:#e0982f; --amber-strong:#c67f1e; --amber-glow:rgba(224,152,47,.5); --on-amber:#1a1206;
    --open:#3f8f63; --open-fill:#dcece2; --taken:#b6503f; --taken-fill:#f3ddd8;
    --shadow:0 1px 2px rgba(20,23,26,.08),0 14px 34px rgba(20,23,26,.1);
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --paper:#14171a; --surface:#1c2024; --surface-2:#22262a;
      --ink:#eef1f2; --ink-dim:#9aa1a5; --ink-faint:#6c7377;
      --line:#33393d; --line-strong:#454c50;
      --amber:#eaa53c; --amber-strong:#f5b657; --amber-glow:rgba(234,165,60,.45); --on-amber:#1a1206;
      --open:#5cb37e; --open-fill:#1c2b23; --taken:#d97764; --taken-fill:#2e211e;
      --shadow:0 1px 2px rgba(0,0,0,.4),0 14px 34px rgba(0,0,0,.3);
    }
  }
  :root[data-theme="dark"] {
    --paper:#14171a; --surface:#1c2024; --surface-2:#22262a;
    --ink:#eef1f2; --ink-dim:#9aa1a5; --ink-faint:#6c7377;
    --line:#33393d; --line-strong:#454c50;
    --amber:#eaa53c; --amber-strong:#f5b657; --amber-glow:rgba(234,165,60,.45); --on-amber:#1a1206;
    --open:#5cb37e; --open-fill:#1c2b23; --taken:#d97764; --taken-fill:#2e211e;
    --shadow:0 1px 2px rgba(0,0,0,.4),0 14px 34px rgba(0,0,0,.3);
  }
  * { box-sizing:border-box; }
  body { margin:0; background:var(--paper); color:var(--ink); font-family:-apple-system,'Segoe UI',Arial,sans-serif; padding:24px 16px 60px; }
  .mono { font-family:ui-monospace,'Cascadia Code','SF Mono',Consolas,monospace; font-variant-numeric:tabular-nums; }
  button { font-family:inherit; }
  *:focus-visible { outline:2px solid var(--amber-strong); outline-offset:2px; }
  h1 { font-size:20px; font-weight:800; margin:0 0 4px; }
  .wrap { max-width:1080px; margin:0 auto; }
  .eyebrow { font-size:11px; font-weight:800; letter-spacing:.1em; text-transform:uppercase; color:var(--ink-faint); margin-bottom:16px; }

  .layout { display:grid; grid-template-columns:1fr 1fr; gap:16px; align-items:start; }
  @media (max-width:820px){ .layout{ grid-template-columns:1fr; } }

  .card { background:var(--surface); border:1px solid var(--line); border-radius:16px; box-shadow:var(--shadow); padding:24px; }
  .stage-cap { font-size:13.5px; color:var(--ink-dim); margin:2px 0 18px; min-height:18px; }

  .choice-row { display:flex; gap:10px; flex-wrap:wrap; }
  .choice-btn { flex:1; min-width:96px; display:flex; flex-direction:column; align-items:center; gap:6px; padding:14px 8px; background:var(--paper); border:1.5px solid var(--line-strong); border-radius:12px; cursor:pointer; }
  .choice-btn:hover { border-color:var(--amber); }
  .choice-btn.picked { border-color:var(--amber); background:var(--open-fill); }
  .choice-btn .label { font-size:12.5px; font-weight:700; }
  .choice-btn .sub { font-size:10px; color:var(--ink-faint); }
  .choice-btn svg { width:34px; height:34px; }

  .garage { display:flex; flex-direction:column; gap:6px; margin:14px 0; }
  .grow { display:flex; align-items:center; gap:6px; }
  .ftag { font-size:9px; font-weight:800; color:var(--ink-faint); width:22px; }
  .tiles { display:flex; gap:6px; flex-wrap:wrap; }
  .tile { width:34px; height:34px; border-radius:8px; border:1.5px solid var(--open); background:var(--open-fill); display:flex; align-items:center; justify-content:center; font-size:9.5px; font-weight:800; color:var(--ink-dim); transition:all .3s; }
  .tile.taken { border-color:var(--taken); background:var(--taken-fill); }
  .tile.hl { transform:scale(1.25); border-color:var(--amber); box-shadow:0 0 0 4px var(--amber-glow); }

  .ticket-stub { width:200px; margin:10px auto; background:var(--paper); border:1.5px dashed var(--line-strong); border-radius:10px; padding:12px; text-align:center; }
  .ticket-stub .tid { font-size:16px; font-weight:800; }
  .ticket-stub .row { display:flex; justify-content:space-between; font-size:11px; color:var(--ink-dim); margin-top:4px; }

  .fee-num { font-size:38px; font-weight:800; color:var(--open); text-align:center; margin:8px 0 2px; }

  button.cta { padding:11px 20px; background:var(--amber); color:var(--on-amber); border:none; border-radius:999px; font-weight:800; font-size:13px; cursor:pointer; }
  button.cta:hover { background:var(--amber-strong); }
  button.cta.ghost { background:transparent; color:var(--ink-dim); border:1.5px solid var(--line-strong); }
  .actions { display:flex; gap:8px; justify-content:center; flex-wrap:wrap; margin-top:14px; }
  .sip { padding:7px 13px; background:var(--surface-2); border:1.5px solid var(--line-strong); border-radius:999px; font-size:12px; font-weight:700; color:var(--ink-dim); cursor:pointer; }
  .plan-toggle { display:flex; gap:6px; justify-content:center; margin-top:10px; }
  .plan-toggle button { padding:6px 12px; border:1.5px solid var(--line-strong); border-radius:999px; background:var(--paper); font-size:11.5px; font-weight:700; color:var(--ink-dim); cursor:pointer; }
  .plan-toggle button.active { background:var(--amber); color:var(--on-amber); border-color:var(--amber); }

  /* trace console */
  .trace-card { max-height:640px; overflow-y:auto; }
  .trace-head { display:flex; justify-content:space-between; align-items:baseline; margin-bottom:10px; }
  .trace-head .t { font-size:12px; font-weight:800; letter-spacing:.08em; text-transform:uppercase; color:var(--ink-dim); }
  .trace-log { display:flex; flex-direction:column; gap:10px; }
  .trace-divider { font-size:10.5px; font-weight:800; color:var(--amber-strong); letter-spacing:.06em; text-transform:uppercase; margin:8px 0 2px; border-top:1px dashed var(--line); padding-top:10px; }
  .trace-step { animation:fadeIn .35s ease; border-left:2.5px solid var(--amber); padding:2px 0 2px 10px; }
  @keyframes fadeIn { from{opacity:0; transform:translateY(4px);} to{opacity:1; transform:none;} }
  .trace-step .code { font-size:12.5px; font-weight:600; color:var(--ink); }
  .trace-step .detail { font-size:11.5px; color:var(--ink-faint); margin-top:2px; }
  .trace-empty { font-size:13px; color:var(--ink-faint); padding:10px 0; }
  @media (prefers-reduced-motion: reduce){ .trace-step{ animation:none; } }
</style>
</head>
<body>

<div class="wrap">
  <div class="eyebrow">Parking Lot · LLD-Prep</div>
  <div class="layout">
    <div class="card" id="stage"></div>
    <div class="card trace-card">
      <div class="trace-head"><span class="t">Live code trace</span><span class="mono" id="step-count" style="font-size:11px;color:var(--ink-faint)"></span></div>
      <div class="trace-log" id="trace-log"><div class="trace-empty">Pick a ride to start — every click below logs the real method call it triggers.</div></div>
    </div>
  </div>
</div>

<script>
(function(){
"use strict";
var COMPATIBLE = { MOTORCYCLE:['SMALL','MEDIUM','LARGE'], CAR:['MEDIUM','LARGE'], TRUCK:['LARGE'] };
var HOURLY_RATE = { MOTORCYCLE:10, CAR:20, TRUCK:50 };
var FLAT_RATE = { MOTORCYCLE:30, CAR:50, TRUCK:100 };
var TYPE_INITIAL = { SMALL:'S', MEDIUM:'M', LARGE:'L' };
var STRAT_CLASS = { ANY:'AnySpotStrategy', EXIT:'NearestToExitStrategy', ELEVATOR:'NearestToElevatorStrategy' };
var VEHICLE_LABEL = { CAR:'Car', MOTORCYCLE:'Motorcycle', TRUCK:'Truck' };

var RAW = [
  {floor:1,type:'SMALL',id:1,exit:1,elev:5},{floor:1,type:'SMALL',id:2,exit:5,elev:1},
  {floor:1,type:'MEDIUM',id:1,exit:2,elev:4},{floor:1,type:'MEDIUM',id:2,exit:4,elev:2},
  {floor:1,type:'LARGE',id:1,exit:3,elev:3},
  {floor:2,type:'SMALL',id:1,exit:1,elev:3},
  {floor:2,type:'MEDIUM',id:1,exit:1,elev:4},{floor:2,type:'MEDIUM',id:2,exit:4,elev:1},
  {floor:2,type:'LARGE',id:1,exit:1,elev:5},{floor:2,type:'LARGE',id:2,exit:5,elev:1}
];
var state = {
  spots: RAW.map(function(s){ return {floor:s.floor,type:s.type,id:s.id,exit:s.exit,elev:s.elev,
    code:'F'+s.floor+'-'+TYPE_INITIAL[s.type]+s.id, occupied:false, vehicle:null}; }),
  ticketSeq:1, clock:0, pricingMode:'HOURLY', current:null, carNum:0
};

function esc(s){ return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }
function randomPlate(){ var L='ABCDEFGHJKLMNPQRSTUVWXYZ'; return 'KA01'+L[Math.random()*L.length|0]+L[Math.random()*L.length|0]+(1000+Math.random()*8999|0); }
function freeOfType(t){ return state.spots.filter(function(s){ return s.type===t && !s.occupied; }); }
function minBy(a,f){ var b=a[0]; for(var i=1;i<a.length;i++) if(f(a[i])<f(b)) b=a[i]; return b; }
function selectSpot(type,strat){ var f=freeOfType(type); if(!f.length) return null;
  if(strat==='EXIT') return minBy(f,function(s){return s.exit;});
  if(strat==='ELEVATOR') return minBy(f,function(s){return s.elev;});
  return minBy(f,function(s){return s.exit;}); }

// ---------- trace log ----------
function logDivider(text){
  var d=document.createElement('div'); d.className='trace-divider'; d.textContent=text;
  document.getElementById('trace-log').appendChild(d);
}
function logStep(codeLine, detail, effect){
  var log = document.getElementById('trace-log');
  var empty = log.querySelector('.trace-empty'); if (empty) empty.remove();
  var div = document.createElement('div'); div.className='trace-step';
  div.innerHTML = '<div class="code mono">'+esc(codeLine)+'</div><div class="detail">'+esc(detail)+'</div>';
  log.appendChild(div);
  div.scrollIntoView({block:'end', behavior:'smooth'});
  if (effect) effect();
}

// ---------- vehicle glyphs ----------
function carG(){return '<svg viewBox="0 0 44 44" fill="none" stroke="currentColor" stroke-width="2"><rect x="10" y="4" width="24" height="36" rx="7"/><line x1="10" y1="17" x2="34" y2="17"/></svg>';}
function motoG(){return '<svg viewBox="0 0 44 44" fill="none" stroke="currentColor" stroke-width="2"><rect x="16" y="4" width="12" height="36" rx="6"/><circle cx="22" cy="10" r="3.6"/><circle cx="22" cy="34" r="3.6"/></svg>';}
function truckG(){return '<svg viewBox="0 0 44 44" fill="none" stroke="currentColor" stroke-width="2"><rect x="8" y="4" width="28" height="16" rx="3"/><rect x="10" y="20" width="24" height="20" rx="3"/></svg>';}
function tiny(type){ var fn=type==='MOTORCYCLE'?motoG:type==='TRUCK'?truckG:carG; return '<svg viewBox="0 0 44 44" width="16" height="16" fill="none" stroke="currentColor" stroke-width="3">'+fn().replace(/^<svg[^>]*>/,'').replace(/<\/svg>$/,'')+'</svg>'; }

function renderGarage(){
  return [1,2].map(function(f){
    var tiles = state.spots.filter(function(s){return s.floor===f;}).map(function(s){
      var cls='tile'+(s.occupied?' taken':'');
      return '<div class="'+cls+'" data-code="'+s.code+'">'+(s.occupied?tiny(s.vehicle):s.type.charAt(0))+'</div>';
    }).join('');
    return '<div class="grow"><span class="ftag mono">F'+f+'</span><div class="tiles">'+tiles+'</div></div>';
  }).join('');
}

// ---------- screens ----------
function screenPickVehicle(){
  var el=document.getElementById('stage');
  el.innerHTML='<h1>Pick a ride</h1><p class="stage-cap">Someone pulls up to the garage.</p>'+
    '<div class="choice-row">'+
    ['CAR','MOTORCYCLE','TRUCK'].map(function(t){
      var g=t==='CAR'?carG():t==='MOTORCYCLE'?motoG():truckG();
      var sub=t==='CAR'?'medium or large':t==='MOTORCYCLE'?'fits anywhere':'large only';
      return '<button class="choice-btn" data-v="'+t+'">'+g+'<span class="label">'+VEHICLE_LABEL[t]+'</span><span class="sub">'+sub+'</span></button>';
    }).join('')+'</div>'+
    '<div id="garage-preview" style="margin-top:16px">'+renderGarage()+'</div>';
  Array.prototype.forEach.call(el.querySelectorAll('[data-v]'), function(b){
    b.addEventListener('click', function(){
      state.carNum++;
      state.current = { vehicleType:b.getAttribute('data-v'), plate:randomPlate() };
      logDivider('— Car #'+state.carNum+': '+state.current.plate+' —');
      logStep('Vehicle vehicle = new '+VEHICLE_LABEL[state.current.vehicleType]+'("'+state.current.plate+'");',
        'compatibleSpotTypes: ['+COMPATIBLE[state.current.vehicleType].join(', ')+']');
      screenPickStrategy();
    });
  });
}

function screenPickStrategy(){
  var el=document.getElementById('stage');
  el.innerHTML='<h1>Where should it park?</h1><p class="stage-cap">Pick a preference.</p>'+
    '<div class="choice-row">'+
    [['ANY','Anywhere',"don't care"],['EXIT','By the door','shortest exit walk'],['ELEVATOR','By the lift','shortest elevator walk']].map(function(s){
      return '<button class="choice-btn" data-s="'+s[0]+'"><span class="label">'+s[1]+'</span><span class="sub">'+s[2]+'</span></button>';
    }).join('')+'</div>'+
    '<div id="garage-preview" style="margin-top:16px">'+renderGarage()+'</div>';
  Array.prototype.forEach.call(el.querySelectorAll('[data-s]'), function(b){
    b.addEventListener('click', function(){
      var strat=b.getAttribute('data-s');
      logStep('parkVehicle(vehicle, entryTime, new '+STRAT_CLASS[strat]+'());',
        'activeTicketsByPlate.containsKey("'+state.current.plate+'") → false ✓');
      screenParkSteps(strat);
    });
  });
}

function buildParkSteps(strat){
  var vt=state.current.vehicleType, plate=state.current.plate;
  var types=COMPATIBLE[vt], steps=[], winner=null;
  for (var i=0;i<types.length;i++){
    var type=types[i], free=freeOfType(type);
    steps.push({code:'for (SpotType type : compatibleSpotTypes) { // '+type, detail:free.length+' free '+type+' spot(s) right now',
      effect:function(t){ return function(){ highlightType(t); }; }(type)});
    if (!free.length){ steps.push({code:'assignmentStrategy.selectSpot('+type+', index) → null', detail:'none free — falls through to next type'}); continue; }
    var spot=selectSpot(type,strat);
    var key=strat==='ELEVATOR'?'elev':'exit', peek=strat==='ELEVATOR'?'peekNearestToElevator':'peekNearestToExit';
    steps.push({code:'index.'+peek+'('+type+') → '+spot.code, detail:'O(log n) heap peek, not a scan — '+(key==='elev'?'elevator':'exit')+' distance = '+spot[key],
      effect:function(sp){ return function(){ highlightTile(sp.code,true); }; }(spot)});
    winner=spot; break;
  }
  steps.push({code:'availabilityIndex.markUnavailable(spot);', detail:winner.code+' removed from both min-heaps',
    effect:function(){ markTaken(winner, vt); }});
  steps.push({code:'spot.assignVehicle(vehicle);', detail:'occupied=true, parkedVehicle=vehicle'});
  var ticketId='T'+state.ticketSeq;
  steps.push({code:'Ticket ticket = new Ticket("'+ticketId+'", vehicle, spot, entryTime);',
    detail:'status=ACTIVE, entryTime=T+'+state.clock+'min'});
  steps.push({code:'activeTicketsByPlate.put("'+plate+'", ticket);', detail:'1 active ticket now tracked',
    effect:function(){
      state.ticketSeq++;
      state.current.ticket={id:ticketId, spotCode:winner.code, spotRef:winner, entry:state.clock};
    }});
  return steps;
}

function highlightType(type){
  Array.prototype.forEach.call(document.querySelectorAll('.tile'), function(t){ t.classList.remove('hl'); });
  state.spots.filter(function(s){return s.type===type && !s.occupied;}).forEach(function(s){
    var el=document.querySelector('.tile[data-code="'+s.code+'"]'); if(el) el.classList.add('hl');
  });
}
function highlightTile(code){
  Array.prototype.forEach.call(document.querySelectorAll('.tile'), function(t){ t.classList.remove('hl'); });
  var el=document.querySelector('.tile[data-code="'+code+'"]'); if(el) el.classList.add('hl');
}
function markTaken(spot, vt){
  spot.occupied=true; spot.vehicle=vt;
  var el=document.querySelector('.tile[data-code="'+spot.code+'"]');
  if(el){ el.classList.remove('hl'); el.classList.add('taken'); el.innerHTML=tiny(vt); }
}

function screenParkSteps(strat){
  var steps=buildParkSteps(strat), idx=0;
  render();
  function render(){
    var el=document.getElementById('stage');
    el.innerHTML='<h1>Watch it happen</h1><p class="stage-cap">Tap through the real call chain.</p>'+
      '<div id="garage-preview">'+renderGarage()+'</div>'+
      '<div class="actions"><button class="cta" id="next-step">Next step →</button></div>';
    document.getElementById('next-step').addEventListener('click', function(){
      var s=steps[idx]; logStep(s.code, s.detail, s.effect); idx++;
      if (idx>=steps.length){ setTimeout(screenTicket, 250); } else { render(); }
    });
  }
}

function screenTicket(){
  var t=state.current.ticket;
  var el=document.getElementById('stage');
  el.innerHTML='<h1>Ticket issued</h1><p class="stage-cap">'+t.id+' — '+t.spotCode+'</p>'+
    '<div class="ticket-stub"><div class="tid mono">'+esc(t.id)+'</div>'+
    '<div class="row"><span>Plate</span><span class="mono">'+esc(state.current.plate)+'</span></div>'+
    '<div class="row"><span>Spot</span><span class="mono">'+esc(t.spotCode)+'</span></div>'+
    '<div class="row"><span>Parked</span><span class="mono" id="parked-min">0</span>&nbsp;min</div></div>'+
    '<div id="garage-preview">'+renderGarage()+'</div>'+
    '<div class="actions"><button class="sip" id="skip">☕ Skip ahead 25min</button>'+
    '<button class="cta" id="drive-out">Drive out →</button></div>';
  document.getElementById('skip').addEventListener('click', function(){
    state.clock+=25; document.getElementById('parked-min').textContent=state.clock-t.entry;
  });
  document.getElementById('drive-out').addEventListener('click', function(){
    logStep('unparkVehicle("'+state.current.plate+'", exitTime);', 'ticket found, status == ACTIVE ✓');
    screenUnparkSteps();
  });
}

function buildUnparkSteps(){
  var t=state.current.ticket, minutes=Math.max(state.clock-t.entry,0), steps=[];
  steps.push({code:'ticket.setExitTime(exitTime);', detail:'parked '+minutes+' min'});
  var cls=state.pricingMode==='HOURLY'?'HourlyPricingStrategy':'FlatRatePricingStrategy', fee, formula;
  if (state.pricingMode==='HOURLY'){
    var bh=Math.max(1,Math.ceil(minutes/60)), rate=HOURLY_RATE[state.current.vehicleType];
    fee=bh*rate; formula='ceil('+minutes+'/60)='+bh+' billedHours × $'+rate+'/hr = $'+fee.toFixed(2);
  } else { fee=FLAT_RATE[state.current.vehicleType]; formula='flatRate.get('+state.current.vehicleType+') = $'+fee.toFixed(2); }
  steps.push({code:'pricingStrategy.calculateFee(ticket);  // '+cls, detail:formula, effect:function(){ showFee(fee); }});
  steps.push({code:'ticket.setFee(fee); ticket.setStatus(PAID);', detail:'$'+fee.toFixed(2)});
  steps.push({code:'ticket.getSpot().release();', detail:t.spotCode+' occupied=false',
    effect:function(){ t.spotRef.occupied=false; t.spotRef.vehicle=null; var el=document.querySelector('.tile[data-code="'+t.spotCode+'"]'); if(el){el.classList.remove('taken'); el.textContent=t.spotRef.type.charAt(0);} }});
  steps.push({code:'availabilityIndex.markAvailable(spot);', detail:'back in both min-heaps'});
  steps.push({code:'activeTicketsByPlate.remove("'+state.current.plate+'");', detail:'0 active tickets'});
  return steps;
}
function showFee(fee){ var f=document.getElementById('fee-num'); if (f) f.textContent='$'+fee.toFixed(2); }

function screenUnparkSteps(){
  var steps=buildUnparkSteps(), idx=0; render();
  function render(){
    var el=document.getElementById('stage');
    el.innerHTML='<h1>Paying &amp; releasing</h1><p class="stage-cap">Tap through checkout.</p>'+
      '<div class="fee-num mono" id="fee-num">$0.00</div>'+
      '<div class="plan-toggle"><button data-p="HOURLY" class="'+(state.pricingMode==='HOURLY'?'active':'')+'">Hourly</button>'+
      '<button data-p="FLAT" class="'+(state.pricingMode==='FLAT'?'active':'')+'">Flat rate</button></div>'+
      '<div id="garage-preview" style="margin-top:14px">'+renderGarage()+'</div>'+
      '<div class="actions"><button class="cta" id="next-step">Next step →</button></div>';
    Array.prototype.forEach.call(el.querySelectorAll('[data-p]'), function(b){
      b.addEventListener('click', function(){ state.pricingMode=b.getAttribute('data-p'); idx=0; document.getElementById('trace-log'); render(); });
    });
    document.getElementById('next-step').addEventListener('click', function(){
      var s=steps[idx]; logStep(s.code, s.detail, s.effect); idx++;
      if (idx>=steps.length){ setTimeout(screenDone, 250); } else { render(); }
    });
  }
}

function screenDone(){
  var el=document.getElementById('stage');
  el.innerHTML='<h1>Done — spot freed</h1><p class="stage-cap">'+esc(state.current.plate)+' drove off.</p>'+
    '<div id="garage-preview">'+renderGarage()+'</div>'+
    '<div class="actions"><button class="cta" id="again">Park another car ↻</button></div>';
  document.getElementById('again').addEventListener('click', function(){ state.current=null; screenPickVehicle(); });
}

screenPickVehicle();
})();
</script>
</body>
</html>
