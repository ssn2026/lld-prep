<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Notification System — Step Through the Code</title>
<style>
  :root {
    --paper:#e6e8ea; --surface:#f6f7f7; --surface-2:#eceeef;
    --ink:#14171a; --ink-dim:#565d61; --ink-faint:#878d90;
    --line:#c7cbcd; --line-strong:#a8adaf;
    --amber:#e0982f; --amber-strong:#c67f1e; --amber-glow:rgba(224,152,47,.5); --on-amber:#1a1206;
    --open:#3f8f63; --open-fill:#dcece2; --taken:#b6503f; --taken-fill:#f3ddd8;
    --shadow:0 1px 2px rgba(20,23,26,.08),0 14px 34px rgba(20,23,26,.1);
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --paper:#14171a; --surface:#1c2024; --surface-2:#22262a;
      --ink:#eef1f2; --ink-dim:#9aa1a5; --ink-faint:#6c7377;
      --line:#33393d; --line-strong:#454c50;
      --amber:#eaa53c; --amber-strong:#f5b657; --amber-glow:rgba(234,165,60,.45); --on-amber:#1a1206;
      --open:#5cb37e; --open-fill:#1c2b23; --taken:#d97764; --taken-fill:#2e211e;
      --shadow:0 1px 2px rgba(0,0,0,.4),0 14px 34px rgba(0,0,0,.3);
    }
  }
  :root[data-theme="dark"] {
    --paper:#14171a; --surface:#1c2024; --surface-2:#22262a;
    --ink:#eef1f2; --ink-dim:#9aa1a5; --ink-faint:#6c7377;
    --line:#33393d; --line-strong:#454c50;
    --amber:#eaa53c; --amber-strong:#f5b657; --amber-glow:rgba(234,165,60,.45); --on-amber:#1a1206;
    --open:#5cb37e; --open-fill:#1c2b23; --taken:#d97764; --taken-fill:#2e211e;
    --shadow:0 1px 2px rgba(0,0,0,.4),0 14px 34px rgba(0,0,0,.3);
  }
  * { box-sizing:border-box; }
  body { margin:0; background:var(--paper); color:var(--ink); font-family:-apple-system,'Segoe UI',Arial,sans-serif; padding:24px 16px 60px; }
  .mono { font-family:ui-monospace,'Cascadia Code','SF Mono',Consolas,monospace; font-variant-numeric:tabular-nums; }
  button { font-family:inherit; }
  *:focus-visible { outline:2px solid var(--amber-strong); outline-offset:2px; }
  h1 { font-size:20px; font-weight:800; margin:0 0 4px; }
  .wrap { max-width:1120px; margin:0 auto; }
  .eyebrow { font-size:11px; font-weight:800; letter-spacing:.1em; text-transform:uppercase; color:var(--ink-faint); margin-bottom:16px; }

  .layout { display:grid; grid-template-columns:1.15fr 1fr; gap:16px; align-items:start; }
  @media (max-width:860px){ .layout{ grid-template-columns:1fr; } }

  .card { background:var(--surface); border:1px solid var(--line); border-radius:16px; box-shadow:var(--shadow); padding:24px; }
  .stage-cap { font-size:13.5px; color:var(--ink-dim); margin:2px 0 14px; min-height:18px; }

  .choice-row { display:flex; gap:10px; flex-wrap:wrap; }
  .choice-btn { flex:1; min-width:110px; display:flex; flex-direction:column; align-items:center; gap:6px; padding:14px 10px; background:var(--paper); border:1.5px solid var(--line-strong); border-radius:12px; cursor:pointer; text-align:center; }
  .choice-btn:hover { border-color:var(--amber); }
  .choice-btn.picked { border-color:var(--amber); background:var(--open-fill); }
  .choice-btn .label { font-size:12.5px; font-weight:700; }
  .choice-btn .sub { font-size:10px; color:var(--ink-faint); }

  .section-label { font-size:10.5px; font-weight:800; letter-spacing:.07em; text-transform:uppercase; color:var(--ink-faint); margin:14px 0 6px; }
  .section-label:first-of-type { margin-top:0; }

  .users-row { display:flex; gap:10px; flex-wrap:wrap; }
  .user-card { background:var(--surface-2); border:1.5px solid var(--line-strong); border-radius:10px; padding:8px 12px; font-size:11.5px; cursor:pointer; }
  .user-card:hover { border-color:var(--amber); }
  .user-card .uname { font-weight:800; }
  .user-card .uchannels { color:var(--ink-dim); font-size:10.5px; margin-top:2px; }

  .content-stack { display:flex; flex-direction:column; gap:6px; }
  .content-layer { padding:8px 12px; border:1.5px solid var(--line-strong); border-radius:8px; background:var(--paper); font-size:11.5px; font-family:ui-monospace,'Cascadia Code','SF Mono',Consolas,monospace; white-space:pre-wrap; }
  .content-layer.new { border-color:var(--amber); background:var(--open-fill); }

  .wire-log { background:#14171a; color:#dcece2; border-radius:10px; padding:12px 14px; font-family:ui-monospace,'Cascadia Code','SF Mono',Consolas,monospace; font-size:11px; min-height:60px; max-height:160px; overflow-y:auto; }
  .wire-line { white-space:pre-wrap; margin-bottom:2px; }
  .wire-empty { color:#6c7377; }

  button.cta { padding:11px 20px; background:var(--amber); color:var(--on-amber); border:none; border-radius:999px; font-weight:800; font-size:13px; cursor:pointer; }
  button.cta:hover { background:var(--amber-strong); }
  button.cta.ghost { background:transparent; color:var(--ink-dim); border:1.5px solid var(--line-strong); }
  .actions { display:flex; gap:8px; justify-content:center; flex-wrap:wrap; margin-top:16px; }

  /* trace console */
  .trace-card { max-height:720px; overflow-y:auto; }
  .trace-head { display:flex; justify-content:space-between; align-items:baseline; margin-bottom:10px; }
  .trace-head .t { font-size:12px; font-weight:800; letter-spacing:.08em; text-transform:uppercase; color:var(--ink-dim); }
  .trace-log { display:flex; flex-direction:column; gap:10px; }
  .trace-divider { font-size:10.5px; font-weight:800; color:var(--amber-strong); letter-spacing:.06em; text-transform:uppercase; margin:8px 0 2px; border-top:1px dashed var(--line); padding-top:10px; }
  .trace-step { animation:fadeIn .35s ease; border-left:2.5px solid var(--amber); padding:2px 0 2px 10px; }
  @keyframes fadeIn { from{opacity:0; transform:translateY(4px);} to{opacity:1; transform:none;} }
  .trace-step .code { font-size:12.5px; font-weight:600; color:var(--ink); }
  .trace-step .detail { font-size:11.5px; color:var(--ink-faint); margin-top:2px; }
  .trace-empty { font-size:13px; color:var(--ink-faint); padding:10px 0; }
  @media (prefers-reduced-motion: reduce){ .trace-step{ animation:none; } }
</style>
</head>
<body>

<div class="wrap">
  <div class="eyebrow">Notification System · LLD-Prep</div>
  <div class="layout">
    <div class="card" id="stage"></div>
    <div class="card trace-card">
      <div class="trace-head"><span class="t">Live code trace</span><span class="mono" id="step-count" style="font-size:11px;color:var(--ink-faint)"></span></div>
      <div class="trace-log" id="trace-log"><div class="trace-empty">Subscribe a user to start — every click below logs the real method call it triggers.</div></div>
    </div>
  </div>
</div>

<script>
(function(){
"use strict";

var USERS = ['Alice','Bob','Carol'];
var CHANNELS = ['EMAIL','SMS','PUSH'];
var PRIORITIES = ['LOW','NORMAL','HIGH'];

var state = {
  subscriptions: { Alice: [], Bob: [], Carol: [] },
  pendingNotify: null
};

function esc(s){ return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }

// ---------- trace log ----------
function logDivider(text){
  var d=document.createElement('div'); d.className='trace-divider'; d.textContent=text;
  document.getElementById('trace-log').appendChild(d);
}
function logStep(codeLine, detail, effect){
  var log = document.getElementById('trace-log');
  var empty = log.querySelector('.trace-empty'); if (empty) empty.remove();
  var div = document.createElement('div'); div.className='trace-step';
  div.innerHTML = '<div class="code mono">'+esc(codeLine)+'</div><div class="detail">'+esc(detail)+'</div>';
  log.appendChild(div);
  div.scrollIntoView({block:'end', behavior:'smooth'});
  if (effect) effect();
}

// ---------- render fragments ----------
function renderUsersHTML(){
  return '<div class="users-row">'+USERS.map(function(u){
    var chans = state.subscriptions[u];
    return '<div class="user-card"><div class="uname">'+u+'</div><div class="uchannels">'+(chans.length?chans.join(', '):'no subscriptions')+'</div></div>';
  }).join('')+'</div>';
}

// ---------- screens ----------
function screenSetup(){
  var el=document.getElementById('stage');
  el.innerHTML='<h1>Subscribe users</h1><p class="stage-cap">Pick a user, then a channel to subscribe them to.</p>'+
    '<div class="section-label">Users</div>'+renderUsersHTML()+
    '<div class="section-label">Subscribe</div>'+
    '<div class="choice-row">'+USERS.map(function(u){ return '<button class="choice-btn" data-u="'+u+'"><span class="label">'+u+'</span><span class="sub">pick user</span></button>'; }).join('')+'</div>'+
    '<div class="actions"><button class="cta" id="done">Done subscribing →</button></div>';
  Array.prototype.forEach.call(el.querySelectorAll('[data-u]'), function(b){
    b.addEventListener('click', function(){ screenPickChannel(b.getAttribute('data-u')); });
  });
  document.getElementById('done').addEventListener('click', screenControlRoom);
}

function screenPickChannel(user){
  var el=document.getElementById('stage');
  el.innerHTML='<h1>Subscribe '+user+'</h1><p class="stage-cap">Which channel?</p>'+
    '<div class="choice-row">'+CHANNELS.map(function(c){ return '<button class="choice-btn" data-c="'+c+'"><span class="label">'+c+'</span></button>'; }).join('')+'</div>'+
    '<div class="section-label">Users</div>'+renderUsersHTML();
  Array.prototype.forEach.call(el.querySelectorAll('[data-c]'), function(b){
    b.addEventListener('click', function(){
      var type = b.getAttribute('data-c');
      logDivider('— subscribe('+user+', '+type+') —');
      logStep('service.subscribe("'+user+'", ChannelType.'+type+');', 'registry.subscribe(...) -- a new '+type.charAt(0)+type.slice(1).toLowerCase()+'Channel observer registered',
        function(){ if (state.subscriptions[user].indexOf(type)<0) state.subscriptions[user].push(type); });
      screenSetup();
    });
  });
}

function buildSendSteps(user, priority, title, body){
  var steps = [];
  steps.push({ code:'Notification n = new NotificationBuilder().title("'+title+'").body("'+body+'").priority('+priority+').build();',
    detail:'title and body both present -> builds successfully' });
  steps.push({ code:'NotificationContent content = new PlainContent(notification);',
    detail:'"['+priority+'] '+title+': '+body+'"' });
  steps.push({ code:'content = new SignatureDecorator(content);',
    detail:'wraps the plain content, appends the signature line -- always applied' });
  if (priority==='HIGH'){
    steps.push({ code:'if (notification.getPriority() == HIGH) content = new UrgentPrefixDecorator(content);',
      detail:'HIGH priority -> service chooses to wrap with the urgency prefix too' });
  } else {
    steps.push({ code:'if (notification.getPriority() == HIGH) content = new UrgentPrefixDecorator(content);',
      detail:priority+' != HIGH -> skipped, content stays as-is' });
  }
  var channels = state.subscriptions[user];
  steps.push({ code:'String rendered = content.render();',
    detail:'each decorator delegates to the one it wraps, then adds its own effect' });
  steps.push({ code:'Collection<NotificationChannel> channels = registry.getChannelsFor("'+user+'");',
    detail: channels.length ? channels.join(', ') : '(none -- '+user+' has no subscriptions)' });
  steps.push({ code:'for (NotificationChannel channel : channels) channel.send("'+user+'", rendered);',
    detail: channels.length + ' channel(s) notified' });
  return steps;
}

function screenSendSteps(user, priority, title, body){
  logDivider('— send('+user+', ...) —');
  var steps=buildSendSteps(user, priority, title, body), idx=0;
  var layers = [];
  render();
  function render(){
    var el=document.getElementById('stage');
    el.innerHTML='<h1>service.send("'+esc(user)+'", ...)</h1><p class="stage-cap">Tap through the real call chain.</p>'+
      '<div class="section-label">Decorator stack</div>'+
      '<div class="content-stack">'+(layers.length ? layers.map(function(l,i){ return '<div class="content-layer'+(i===layers.length-1?' new':'')+'">'+esc(l)+'</div>'; }).join('') : '<div class="content-layer">(not built yet)</div>')+'</div>'+
      '<div class="actions"><button class="cta" id="next-step">Next step →</button></div>';
    document.getElementById('next-step').addEventListener('click', function(){
      var s=steps[idx]; logStep(s.code, s.detail, s.effect); idx++;
      if (idx===2) layers.push('[' + priority + '] ' + title + ': ' + body);
      if (idx===3) layers.push(layers[layers.length-1] + '\n-- Sent by NotifyService');
      if (idx===4 && priority==='HIGH') layers.push('*** URGENT *** ' + layers[layers.length-1]);
      if (idx>=steps.length){ setTimeout(screenControlRoom, 200); } else { render(); }
    });
  }
}

function screenControlRoom(){
  var el=document.getElementById('stage');
  el.innerHTML='<h1>Control room</h1><p class="stage-cap">NotificationService, live.</p>'+
    '<div class="section-label">Users</div>'+renderUsersHTML()+
    '<div class="section-label">Send a notification to</div>'+
    '<div class="choice-row">'+USERS.map(function(u){ return '<button class="choice-btn" data-notify="'+u+'"><span class="label">'+u+'</span></button>'; }).join('')+'</div>'+
    '<div class="actions"><button class="cta ghost" id="reset">Reset simulation ↻</button></div>';
  Array.prototype.forEach.call(el.querySelectorAll('[data-notify]'), function(b){
    b.addEventListener('click', function(){ screenPickPriority(b.getAttribute('data-notify')); });
  });
  document.getElementById('reset').addEventListener('click', function(){
    state = { subscriptions:{Alice:[],Bob:[],Carol:[]}, pendingNotify:null };
    document.getElementById('trace-log').innerHTML='<div class="trace-empty">Subscribe a user to start — every click below logs the real method call it triggers.</div>';
    screenSetup();
  });
}

function screenPickPriority(user){
  var el=document.getElementById('stage');
  el.innerHTML='<h1>Notify '+user+'</h1><p class="stage-cap">Pick a priority.</p>'+
    '<div class="choice-row">'+PRIORITIES.map(function(p){ return '<button class="choice-btn" data-p="'+p+'"><span class="label">'+p+'</span></button>'; }).join('')+'</div>';
  Array.prototype.forEach.call(el.querySelectorAll('[data-p]'), function(b){
    b.addEventListener('click', function(){
      var priority = b.getAttribute('data-p');
      var titles = { LOW:'WeeklyDigest', NORMAL:'Welcome', HIGH:'ServerDown' };
      var bodies = { LOW:'Here is what you missed this week', NORMAL:'Thanks for signing up!', HIGH:'The database is unreachable' };
      screenSendSteps(user, priority, titles[priority], bodies[priority]);
    });
  });
}

screenSetup();
})();
</script>
</body>
</html>
