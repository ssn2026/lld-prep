<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>TODO List — Step Through the Code</title>
<style>
  :root {
    --paper:#e6e8ea; --surface:#f6f7f7; --surface-2:#eceeef;
    --ink:#14171a; --ink-dim:#565d61; --ink-faint:#878d90;
    --line:#c7cbcd; --line-strong:#a8adaf;
    --amber:#e0982f; --amber-strong:#c67f1e; --amber-glow:rgba(224,152,47,.5); --on-amber:#1a1206;
    --open:#3f8f63; --open-fill:#dcece2; --taken:#b6503f; --taken-fill:#f3ddd8;
    --shadow:0 1px 2px rgba(20,23,26,.08),0 14px 34px rgba(20,23,26,.1);
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --paper:#14171a; --surface:#1c2024; --surface-2:#22262a;
      --ink:#eef1f2; --ink-dim:#9aa1a5; --ink-faint:#6c7377;
      --line:#33393d; --line-strong:#454c50;
      --amber:#eaa53c; --amber-strong:#f5b657; --amber-glow:rgba(234,165,60,.45); --on-amber:#1a1206;
      --open:#5cb37e; --open-fill:#1c2b23; --taken:#d97764; --taken-fill:#2e211e;
      --shadow:0 1px 2px rgba(0,0,0,.4),0 14px 34px rgba(0,0,0,.3);
    }
  }
  :root[data-theme="dark"] {
    --paper:#14171a; --surface:#1c2024; --surface-2:#22262a;
    --ink:#eef1f2; --ink-dim:#9aa1a5; --ink-faint:#6c7377;
    --line:#33393d; --line-strong:#454c50;
    --amber:#eaa53c; --amber-strong:#f5b657; --amber-glow:rgba(234,165,60,.45); --on-amber:#1a1206;
    --open:#5cb37e; --open-fill:#1c2b23; --taken:#d97764; --taken-fill:#2e211e;
    --shadow:0 1px 2px rgba(0,0,0,.4),0 14px 34px rgba(0,0,0,.3);
  }
  * { box-sizing:border-box; }
  body { margin:0; background:var(--paper); color:var(--ink); font-family:-apple-system,'Segoe UI',Arial,sans-serif; padding:24px 16px 60px; }
  .mono { font-family:ui-monospace,'Cascadia Code','SF Mono',Consolas,monospace; font-variant-numeric:tabular-nums; }
  button { font-family:inherit; }
  *:focus-visible { outline:2px solid var(--amber-strong); outline-offset:2px; }
  h1 { font-size:20px; font-weight:800; margin:0 0 4px; }
  .wrap { max-width:1120px; margin:0 auto; }
  .eyebrow { font-size:11px; font-weight:800; letter-spacing:.1em; text-transform:uppercase; color:var(--ink-faint); margin-bottom:16px; }

  .layout { display:grid; grid-template-columns:1.15fr 1fr; gap:16px; align-items:start; }
  @media (max-width:860px){ .layout{ grid-template-columns:1fr; } }

  .card { background:var(--surface); border:1px solid var(--line); border-radius:16px; box-shadow:var(--shadow); padding:24px; }
  .stage-cap { font-size:13.5px; color:var(--ink-dim); margin:2px 0 14px; min-height:18px; }

  .choice-row { display:flex; gap:10px; flex-wrap:wrap; }
  .choice-btn { flex:1; min-width:110px; display:flex; flex-direction:column; align-items:center; gap:6px; padding:14px 10px; background:var(--paper); border:1.5px solid var(--line-strong); border-radius:12px; cursor:pointer; text-align:center; }
  .choice-btn:hover { border-color:var(--amber); }
  .choice-btn .label { font-size:12.5px; font-weight:700; }
  .choice-btn .sub { font-size:10px; color:var(--ink-faint); }

  .section-label { font-size:10.5px; font-weight:800; letter-spacing:.07em; text-transform:uppercase; color:var(--ink-faint); margin:14px 0 6px; }
  .section-label:first-of-type { margin-top:0; }

  .board { display:grid; grid-template-columns:repeat(4,1fr); gap:8px; }
  @media (max-width:600px){ .board{ grid-template-columns:repeat(2,1fr); } }
  .lane { background:var(--surface-2); border:1px solid var(--line); border-radius:10px; padding:8px; min-height:60px; }
  .lane .lane-title { font-size:9.5px; font-weight:800; color:var(--ink-faint); text-transform:uppercase; letter-spacing:.05em; margin-bottom:6px; }
  .tcard { background:var(--paper); border:1.5px solid var(--line-strong); border-radius:8px; padding:6px 8px; font-size:11px; margin-bottom:6px; }
  .tcard.next { border-color:var(--amber); background:var(--open-fill); }
  .tcard .tid { font-weight:800; }
  .tcard .tprio { color:var(--ink-dim); font-size:9.5px; }
  .lane-empty { font-size:10.5px; color:var(--ink-faint); }

  button.cta { padding:11px 20px; background:var(--amber); color:var(--on-amber); border:none; border-radius:999px; font-weight:800; font-size:13px; cursor:pointer; }
  button.cta:hover { background:var(--amber-strong); }
  button.cta:disabled { opacity:.4; cursor:not-allowed; }
  button.cta.ghost { background:transparent; color:var(--ink-dim); border:1.5px solid var(--line-strong); }
  .actions { display:flex; gap:8px; justify-content:center; flex-wrap:wrap; margin-top:16px; }

  /* trace console */
  .trace-card { max-height:720px; overflow-y:auto; }
  .trace-head { display:flex; justify-content:space-between; align-items:baseline; margin-bottom:10px; }
  .trace-head .t { font-size:12px; font-weight:800; letter-spacing:.08em; text-transform:uppercase; color:var(--ink-dim); }
  .trace-log { display:flex; flex-direction:column; gap:10px; }
  .trace-divider { font-size:10.5px; font-weight:800; color:var(--amber-strong); letter-spacing:.06em; text-transform:uppercase; margin:8px 0 2px; border-top:1px dashed var(--line); padding-top:10px; }
  .trace-step { animation:fadeIn .35s ease; border-left:2.5px solid var(--amber); padding:2px 0 2px 10px; }
  @keyframes fadeIn { from{opacity:0; transform:translateY(4px);} to{opacity:1; transform:none;} }
  .trace-step .code { font-size:12.5px; font-weight:600; color:var(--ink); }
  .trace-step .detail { font-size:11.5px; color:var(--ink-faint); margin-top:2px; }
  .trace-empty { font-size:13px; color:var(--ink-faint); padding:10px 0; }
  @media (prefers-reduced-motion: reduce){ .trace-step{ animation:none; } }
</style>
</head>
<body>

<div class="wrap">
  <div class="eyebrow">TODO List · LLD-Prep</div>
  <div class="layout">
    <div class="card" id="stage"></div>
    <div class="card trace-card">
      <div class="trace-head"><span class="t">Live code trace</span><span class="mono" id="step-count" style="font-size:11px;color:var(--ink-faint)"></span></div>
      <div class="trace-log" id="trace-log"><div class="trace-empty">Add a task to start — every click below logs the real method call it triggers.</div></div>
    </div>
  </div>
</div>

<script>
(function(){
"use strict";

var PRIORITIES = ['LOW','MEDIUM','HIGH'];
var STATUSES = ['TODO','IN_PROGRESS','DONE','ARCHIVED'];

var state = {
  tasks: [],      // {id, title, priority, dueInDays, status}
  idSeq: 0,
  pendingTask: null
};

function esc(s){ return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }

// ---------- trace log ----------
function logDivider(text){
  var d=document.createElement('div'); d.className='trace-divider'; d.textContent=text;
  document.getElementById('trace-log').appendChild(d);
}
function logStep(codeLine, detail, effect){
  var log = document.getElementById('trace-log');
  var empty = log.querySelector('.trace-empty'); if (empty) empty.remove();
  var div = document.createElement('div'); div.className='trace-step';
  div.innerHTML = '<div class="code mono">'+esc(codeLine)+'</div><div class="detail">'+esc(detail)+'</div>';
  log.appendChild(div);
  div.scrollIntoView({block:'end', behavior:'smooth'});
  if (effect) effect();
}

// ---------- board ----------
function renderBoardHTML(){
  return '<div class="board">'+STATUSES.map(function(status){
    var inLane = state.tasks.filter(function(t){ return t.status===status; });
    var body = inLane.length
      ? inLane.map(function(t){ return '<div class="tcard"><span class="tid mono">'+t.id+'</span> '+esc(t.title)+
          '<div class="tprio">'+t.priority+' · due '+t.dueInDays+'d</div></div>'; }).join('')
      : '<div class="lane-empty">empty</div>';
    return '<div class="lane"><div class="lane-title">'+status.replace('_',' ')+'</div>'+body+'</div>';
  }).join('')+'</div>';
}

// ---------- screens ----------
function screenAddTask(){
  state.idSeq++;
  var titles = ['BuyGroceries','FileTaxes','ReadBook','WalkDog','PayRent','WriteReport'];
  var title = titles[(state.idSeq-1) % titles.length] + (state.idSeq>titles.length ? state.idSeq : '');
  state.pendingTask = { id:'T'+state.idSeq, title:title };
  var el=document.getElementById('stage');
  el.innerHTML='<h1>Add '+state.pendingTask.id+': '+esc(title)+'</h1>'+
    '<p class="stage-cap">Pick a priority.</p>'+
    '<div class="choice-row">'+PRIORITIES.map(function(p){
      return '<button class="choice-btn" data-p="'+p+'"><span class="label">'+p+'</span><span class="sub">priority</span></button>';
    }).join('')+'</div>'+
    '<div class="section-label">Board</div>'+renderBoardHTML();
  Array.prototype.forEach.call(el.querySelectorAll('[data-p]'), function(b){
    b.addEventListener('click', function(){
      state.pendingTask.priority=b.getAttribute('data-p');
      state.pendingTask.dueInDays = state.pendingTask.priority==='HIGH' ? 2 : state.pendingTask.priority==='MEDIUM' ? 7 : 21;
      logDivider('— Adding '+state.pendingTask.id+' —');
      screenAddSteps();
    });
  });
}

function buildAddSteps(){
  var pt=state.pendingTask, steps=[];
  steps.push({
    code:'String taskId = "'+pt.id+'";',
    detail:'idSeq.incrementAndGet()'
  });
  steps.push({
    code:'Task task = new Task(taskId, "'+pt.title+'", ..., '+pt.priority+', '+pt.dueInDays+', order);',
    detail:'constructor sets state = TodoState.INSTANCE  (every Task starts in TODO)'
  });
  steps.push({
    code:'repository.save(task);',
    detail:'LinkedHashMap: "'+pt.id+'" → task  (insertion order preserved for CreatedOrderSortStrategy)',
    effect:function(){ state.tasks.push({id:pt.id, title:pt.title, priority:pt.priority, dueInDays:pt.dueInDays, status:'TODO'}); }
  });
  return steps;
}

function screenAddSteps(){
  var steps=buildAddSteps(), idx=0;
  render();
  function render(){
    var el=document.getElementById('stage');
    el.innerHTML='<h1>addTask(...)</h1><p class="stage-cap">Tap through the real call chain.</p>'+
      '<div class="section-label">Board</div>'+renderBoardHTML()+
      '<div class="actions"><button class="cta" id="next-step">Next step →</button></div>';
    document.getElementById('next-step').addEventListener('click', function(){
      var s=steps[idx]; logStep(s.code, s.detail, s.effect); idx++;
      if (idx>=steps.length){ setTimeout(screenControlRoom, 200); } else { render(); }
    });
  }
}

var TRANSITIONS = {
  TODO:        { start:'IN_PROGRESS', complete:'DONE' },
  IN_PROGRESS: { complete:'DONE' },
  DONE:        { reopen:'TODO', archive:'ARCHIVED' },
  ARCHIVED:    {}
};
var STATE_CLASS = { TODO:'TodoState', IN_PROGRESS:'InProgressState', DONE:'DoneState', ARCHIVED:'ArchivedState' };

function buildTransitionSteps(task, action){
  var from = task.status;
  var allowed = TRANSITIONS[from] && TRANSITIONS[from][action];
  var steps = [];
  steps.push({
    code:'task.'+action+'();',
    detail:'delegates to state.'+action+'(this)   // current state = '+STATE_CLASS[from]
  });
  if (!allowed){
    steps.push({
      code:STATE_CLASS[from]+' does not override '+action+'() → falls through to TaskState default',
      detail:'throw new InvalidTaskTransitionException(' + from + ', "'+action+'")'
    });
    return steps;
  }
  steps.push({
    code:STATE_CLASS[from]+'.'+action+'(task) → '+STATE_CLASS[allowed]+'.INSTANCE',
    detail:'a shared singleton — no new object allocated'
  });
  steps.push({
    code:'task.state = '+STATE_CLASS[allowed]+'.INSTANCE;',
    detail:'status: '+from+' → '+allowed,
    effect:function(){ task.status = allowed; }
  });
  steps.push({
    code:'notifyStatusChanged("'+task.id+'", '+from+', '+allowed+');',
    detail:'ConsoleTaskListener notified (Observer) — before != after, so the notification actually fires'
  });
  return steps;
}

function screenTransitionSteps(task, action){
  var steps=buildTransitionSteps(task, action), idx=0;
  logDivider('— '+action+'('+task.id+') —');
  render();
  function render(){
    var el=document.getElementById('stage');
    el.innerHTML='<h1>'+action+'Task("'+esc(task.id)+'")</h1>'+
      '<p class="stage-cap">Tap through the state transition.</p>'+
      '<div class="section-label">Board</div>'+renderBoardHTML()+
      '<div class="actions"><button class="cta" id="next-step">Next step →</button></div>';
    document.getElementById('next-step').addEventListener('click', function(){
      var s=steps[idx]; logStep(s.code, s.detail, s.effect); idx++;
      if (idx>=steps.length){ setTimeout(screenControlRoom, 200); } else { render(); }
    });
  }
}

function screenPickTaskForAction(action){
  var el=document.getElementById('stage');
  el.innerHTML='<h1>'+action+' which task?</h1><p class="stage-cap">Pick any task — legal or not, you\'ll see what happens.</p>'+
    '<div class="board" id="pick-board"></div>'+
    '<div class="actions"><button class="cta ghost" id="back">← Back</button></div>';
  var board = document.getElementById('pick-board');
  if (!state.tasks.length){
    board.innerHTML = '<div class="lane-empty">No tasks yet.</div>';
  } else {
    state.tasks.forEach(function(t){
      var d=document.createElement('div');
      d.className='tcard'; d.style.cursor='pointer';
      d.innerHTML='<span class="tid mono">'+t.id+'</span> '+esc(t.title)+'<div class="tprio">status='+t.status+'</div>';
      d.addEventListener('click', function(){ screenTransitionSteps(t, action.toLowerCase()); });
      board.appendChild(d);
    });
  }
  document.getElementById('back').addEventListener('click', screenControlRoom);
}

function screenControlRoom(){
  var el=document.getElementById('stage');
  el.innerHTML='<h1>Control room</h1><p class="stage-cap">TodoListService, live.</p>'+
    '<div class="section-label">Board</div>'+renderBoardHTML()+
    '<div class="actions">'+
      '<button class="cta" id="add">Add another task →</button>'+
      '<button class="cta ghost" id="start">Start →</button>'+
      '<button class="cta ghost" id="complete">Complete →</button>'+
      '<button class="cta ghost" id="reopen">Reopen →</button>'+
      '<button class="cta ghost" id="archive">Archive →</button>'+
      '<button class="cta ghost" id="reset">Reset simulation ↻</button>'+
    '</div>';
  document.getElementById('add').addEventListener('click', screenAddTask);
  document.getElementById('start').addEventListener('click', function(){ screenPickTaskForAction('Start'); });
  document.getElementById('complete').addEventListener('click', function(){ screenPickTaskForAction('Complete'); });
  document.getElementById('reopen').addEventListener('click', function(){ screenPickTaskForAction('Reopen'); });
  document.getElementById('archive').addEventListener('click', function(){ screenPickTaskForAction('Archive'); });
  document.getElementById('reset').addEventListener('click', function(){
    state.tasks=[]; state.idSeq=0; state.pendingTask=null;
    document.getElementById('trace-log').innerHTML='<div class="trace-empty">Add a task to start — every click below logs the real method call it triggers.</div>';
    screenAddTask();
  });
}

screenAddTask();
})();
</script>
</body>
</html>
