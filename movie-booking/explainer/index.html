<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Movie Booking — Step Through the Code</title>
<style>
  :root {
    --paper:#e6e8ea; --surface:#f6f7f7; --surface-2:#eceeef;
    --ink:#14171a; --ink-dim:#565d61; --ink-faint:#878d90;
    --line:#c7cbcd; --line-strong:#a8adaf;
    --amber:#e0982f; --amber-strong:#c67f1e; --amber-glow:rgba(224,152,47,.5); --on-amber:#1a1206;
    --open:#3f8f63; --open-fill:#dcece2; --taken:#b6503f; --taken-fill:#f3ddd8;
    --shadow:0 1px 2px rgba(20,23,26,.08),0 14px 34px rgba(20,23,26,.1);
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --paper:#14171a; --surface:#1c2024; --surface-2:#22262a;
      --ink:#eef1f2; --ink-dim:#9aa1a5; --ink-faint:#6c7377;
      --line:#33393d; --line-strong:#454c50;
      --amber:#eaa53c; --amber-strong:#f5b657; --amber-glow:rgba(234,165,60,.45); --on-amber:#1a1206;
      --open:#5cb37e; --open-fill:#1c2b23; --taken:#d97764; --taken-fill:#2e211e;
      --shadow:0 1px 2px rgba(0,0,0,.4),0 14px 34px rgba(0,0,0,.3);
    }
  }
  :root[data-theme="dark"] {
    --paper:#14171a; --surface:#1c2024; --surface-2:#22262a;
    --ink:#eef1f2; --ink-dim:#9aa1a5; --ink-faint:#6c7377;
    --line:#33393d; --line-strong:#454c50;
    --amber:#eaa53c; --amber-strong:#f5b657; --amber-glow:rgba(234,165,60,.45); --on-amber:#1a1206;
    --open:#5cb37e; --open-fill:#1c2b23; --taken:#d97764; --taken-fill:#2e211e;
    --shadow:0 1px 2px rgba(0,0,0,.4),0 14px 34px rgba(0,0,0,.3);
  }
  * { box-sizing:border-box; }
  body { margin:0; background:var(--paper); color:var(--ink); font-family:-apple-system,'Segoe UI',Arial,sans-serif; padding:24px 16px 60px; }
  .mono { font-family:ui-monospace,'Cascadia Code','SF Mono',Consolas,monospace; font-variant-numeric:tabular-nums; }
  button { font-family:inherit; }
  *:focus-visible { outline:2px solid var(--amber-strong); outline-offset:2px; }
  h1 { font-size:20px; font-weight:800; margin:0 0 4px; }
  .wrap { max-width:1080px; margin:0 auto; }
  .eyebrow { font-size:11px; font-weight:800; letter-spacing:.1em; text-transform:uppercase; color:var(--ink-faint); margin-bottom:16px; }

  .layout { display:grid; grid-template-columns:1fr 1fr; gap:16px; align-items:start; }
  @media (max-width:820px){ .layout{ grid-template-columns:1fr; } }

  .card { background:var(--surface); border:1px solid var(--line); border-radius:16px; box-shadow:var(--shadow); padding:24px; }
  .stage-cap { font-size:13.5px; color:var(--ink-dim); margin:2px 0 18px; min-height:18px; }

  .choice-row { display:flex; gap:10px; flex-wrap:wrap; }
  .choice-btn { flex:1; min-width:96px; display:flex; flex-direction:column; align-items:center; gap:6px; padding:14px 8px; background:var(--paper); border:1.5px solid var(--line-strong); border-radius:12px; cursor:pointer; }
  .choice-btn:hover { border-color:var(--amber); }
  .choice-btn.picked { border-color:var(--amber); background:var(--open-fill); }
  .choice-btn.small { min-width:72px; padding:10px 6px; }
  .choice-btn .label { font-size:12.5px; font-weight:700; }
  .choice-btn .sub { font-size:10px; color:var(--ink-faint); }
  .choice-btn svg { width:34px; height:34px; }
  .choice-btn .avatar { width:30px; height:30px; border-radius:50%; background:var(--open-fill); border:1.5px solid var(--open); display:flex; align-items:center; justify-content:center; font-weight:800; font-size:12.5px; color:var(--ink); }

  .legend { display:flex; gap:8px; flex-wrap:wrap; margin:0 0 14px; }
  .legend-chip { padding:4px 10px; border-radius:999px; background:var(--surface-2); border:1px solid var(--line); font-size:10.5px; font-weight:700; color:var(--ink-dim); }

  .garage { display:flex; flex-direction:column; gap:6px; margin:14px 0; }
  .grow { display:flex; align-items:center; gap:8px; }
  .ftag { font-size:10.5px; font-weight:800; color:var(--ink-faint); width:16px; }
  .rtype { font-size:9px; font-weight:800; color:var(--ink-faint); width:64px; text-transform:uppercase; letter-spacing:.03em; }
  .tiles { display:flex; gap:6px; flex-wrap:wrap; }
  .tile { width:34px; height:34px; border-radius:8px; border:1.5px solid var(--open); background:var(--open-fill); display:flex; align-items:center; justify-content:center; font-size:12px; font-weight:800; color:var(--ink-dim); transition:all .3s; cursor:pointer; }
  .tile.taken { border-color:var(--taken); background:var(--taken-fill); cursor:not-allowed; }
  .tile.hl { transform:scale(1.2); border-color:var(--amber); box-shadow:0 0 0 4px var(--amber-glow); color:var(--ink); }

  .booking-list { display:flex; flex-direction:column; gap:6px; margin:6px 0 4px; }
  .booking-item { display:flex; align-items:center; gap:10px; padding:8px 10px; background:var(--paper); border:1px solid var(--line); border-radius:10px; font-size:11.5px; color:var(--ink-dim); flex-wrap:wrap; }
  .booking-item .mono:first-child { font-weight:800; color:var(--ink); }
  .booking-item button { margin-left:auto; }

  .ticket-stub { width:220px; margin:10px auto; background:var(--paper); border:1.5px dashed var(--line-strong); border-radius:10px; padding:12px; text-align:center; }
  .ticket-stub.cancelled { opacity:.6; }
  .ticket-stub svg { width:26px; height:26px; margin:0 auto 6px; display:block; color:var(--ink-faint); }
  .ticket-stub .tid { font-size:16px; font-weight:800; }
  .ticket-stub .row { display:flex; justify-content:space-between; font-size:11px; color:var(--ink-dim); margin-top:4px; }

  .fee-num { font-size:34px; font-weight:800; color:var(--open); text-align:center; margin:6px 0 12px; }
  .console-line { text-align:center; font-size:11.5px; color:var(--ink-faint); background:var(--surface-2); border:1px dashed var(--line); border-radius:8px; padding:8px 10px; margin:10px 0; word-break:break-word; }

  button.cta { padding:11px 20px; background:var(--amber); color:var(--on-amber); border:none; border-radius:999px; font-weight:800; font-size:13px; cursor:pointer; }
  button.cta:hover { background:var(--amber-strong); }
  button.cta.ghost { background:transparent; color:var(--ink-dim); border:1.5px solid var(--line-strong); }
  .actions { display:flex; gap:8px; justify-content:center; flex-wrap:wrap; margin-top:14px; align-items:center; }
  .sip { padding:7px 13px; background:var(--surface-2); border:1.5px solid var(--line-strong); border-radius:999px; font-size:12px; font-weight:700; color:var(--ink-dim); cursor:pointer; }

  /* trace console */
  .trace-card { max-height:640px; overflow-y:auto; }
  .trace-head { display:flex; justify-content:space-between; align-items:baseline; margin-bottom:10px; }
  .trace-head .t { font-size:12px; font-weight:800; letter-spacing:.08em; text-transform:uppercase; color:var(--ink-dim); }
  .trace-log { display:flex; flex-direction:column; gap:10px; }
  .trace-divider { font-size:10.5px; font-weight:800; color:var(--amber-strong); letter-spacing:.06em; text-transform:uppercase; margin:8px 0 2px; border-top:1px dashed var(--line); padding-top:10px; }
  .trace-step { animation:fadeIn .35s ease; border-left:2.5px solid var(--amber); padding:2px 0 2px 10px; }
  @keyframes fadeIn { from{opacity:0; transform:translateY(4px);} to{opacity:1; transform:none;} }
  .trace-step .code { font-size:12.5px; font-weight:600; color:var(--ink); }
  .trace-step .detail { font-size:11.5px; color:var(--ink-faint); margin-top:2px; }
  .trace-empty { font-size:13px; color:var(--ink-faint); padding:10px 0; }
  @media (prefers-reduced-motion: reduce){ .trace-step{ animation:none; } }
</style>
</head>
<body>

<div class="wrap">
  <div class="eyebrow">Movie Booking · LLD-Prep</div>
  <div class="layout">
    <div class="card" id="stage"></div>
    <div class="card trace-card">
      <div class="trace-head"><span class="t">Live code trace</span></div>
      <div class="trace-log" id="trace-log"><div class="trace-empty">Pick a movie to start — every click below logs the real method call it triggers.</div></div>
    </div>
  </div>
</div>

<script>
(function(){
"use strict";

var USERS = [
  {id:'U1', name:'Alice', email:'alice@test.com'},
  {id:'U2', name:'Bob', email:'bob@test.com'},
  {id:'U3', name:'Carol', email:'carol@test.com'},
  {id:'U4', name:'Dan', email:'dan@test.com'}
];
var SHOWS_META = [
  {id:'SH1', movie:'Inception', theaterName:'PVR_Andheri', city:'Mumbai', startTime:'2026-08-08T12:00', basePrice:250, rows:5, seatsPerRow:4},
  {id:'SH2', movie:'Interstellar', theaterName:'INOX_Indiranagar', city:'Bangalore', startTime:'2026-08-08T13:00', basePrice:300, rows:5, seatsPerRow:4}
];
var STRAT_CLASS = { REGULAR:'RegularPricingStrategy', PREMIUM:'PremiumPricingStrategy', RECLINER:'ReclinerPricingStrategy' };
var MULTIPLIER = { REGULAR:1.0, PREMIUM:1.5, RECLINER:2.0 };

// ---------- Screen.generateSeats() / seatTypeForRow(), mirrored exactly ----------
function seatTypeForRow(rowIndex, totalRows) {
  if (rowIndex < totalRows * 0.4) return 'REGULAR';
  if (rowIndex < totalRows * 0.7) return 'PREMIUM';
  return 'RECLINER';
}
function buildShow(meta) {
  var seats = [], rowLabels = [];
  for (var r = 0; r < meta.rows; r++) {
    var rowLabel = String.fromCharCode(65 + r);
    rowLabels.push(rowLabel);
    var type = seatTypeForRow(r, meta.rows);
    for (var n = 1; n <= meta.seatsPerRow; n++) {
      seats.push({ id: rowLabel + n, row: rowLabel, number: n, type: type, status: 'AVAILABLE' });
    }
  }
  var show = {};
  for (var k in meta) show[k] = meta[k];
  show.seats = seats;
  show.rowLabels = rowLabels;
  return show;
}

var state = { shows: {}, usersById: {}, bookings: {}, bookingSeq: 1, current: { showId: null, userId: null, selectedSeats: [] } };
SHOWS_META.forEach(function (m) { state.shows[m.id] = buildShow(m); });

function esc(s){ return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }
function jd(n){ n = Math.round(n*100)/100; return (n === Math.trunc(n)) ? n.toFixed(1) : String(n); }
function calcPrice(type, base){ return base * MULTIPLIER[type]; }
function findSeat(show, id){ return show.seats.filter(function(s){ return s.id === id; })[0]; }
function findUser(id){ return USERS.filter(function(u){ return u.id === id; })[0]; }
function countsString(showId){
  var show = state.shows[showId], counts = {REGULAR:0,PREMIUM:0,RECLINER:0}, total = 0;
  show.seats.forEach(function(s){ if (s.status === 'AVAILABLE') { counts[s.type]++; total++; } });
  return total + ' available — ' + counts.REGULAR + ' REGULAR, ' + counts.PREMIUM + ' PREMIUM, ' + counts.RECLINER + ' RECLINER';
}
function existingBookingsFor(showId){
  return Object.keys(state.bookings).map(function(k){ return state.bookings[k]; })
    .filter(function(b){ return b.showId === showId && b.status === 'CONFIRMED'; });
}

// ---------- trace log ----------
function logDivider(text){
  var d=document.createElement('div'); d.className='trace-divider'; d.textContent=text;
  document.getElementById('trace-log').appendChild(d);
}
function logStep(codeLine, detail, effect){
  var log = document.getElementById('trace-log');
  var empty = log.querySelector('.trace-empty'); if (empty) empty.remove();
  var div = document.createElement('div'); div.className='trace-step';
  div.innerHTML = '<div class="code mono">'+esc(codeLine)+'</div><div class="detail">'+esc(detail)+'</div>';
  log.appendChild(div);
  div.scrollIntoView({block:'end', behavior:'smooth'});
  if (effect) effect();
}

// ---------- glyphs ----------
function filmG(){ return '<svg viewBox="0 0 44 44" fill="none" stroke="currentColor" stroke-width="2"><rect x="6" y="10" width="32" height="24" rx="3"/><circle cx="14" cy="16" r="1.6" fill="currentColor" stroke="none"/><circle cx="30" cy="16" r="1.6" fill="currentColor" stroke="none"/><circle cx="14" cy="28" r="1.6" fill="currentColor" stroke="none"/><circle cx="30" cy="28" r="1.6" fill="currentColor" stroke="none"/><circle cx="22" cy="22" r="6"/></svg>'; }
function ticketG(){ return '<svg viewBox="0 0 44 44" fill="none" stroke="currentColor" stroke-width="2"><path d="M6 16a4 4 0 000 8"/><path d="M38 16a4 4 0 010 8"/><rect x="6" y="10" width="32" height="20" rx="3"/><line x1="26" y1="10" x2="26" y2="30" stroke-dasharray="3 3"/></svg>'; }

// ---------- seating chart ----------
function legendChips(show){
  return ['REGULAR','PREMIUM','RECLINER'].map(function(t){
    return '<span class="legend-chip">'+t+' ×'+MULTIPLIER[t].toFixed(1)+' = $'+jd(calcPrice(t, show.basePrice))+'</span>';
  }).join('');
}
function renderSeatGrid(showId, highlightIds){
  highlightIds = highlightIds || [];
  var show = state.shows[showId];
  return show.rowLabels.map(function(rowLabel){
    var rowSeats = show.seats.filter(function(s){ return s.row === rowLabel; });
    var type = rowSeats[0].type;
    var tiles = rowSeats.map(function(s){
      var cls = 'tile' + (s.status === 'BOOKED' ? ' taken' : '') + (highlightIds.indexOf(s.id) >= 0 ? ' hl' : '');
      return '<div class="'+cls+'" data-seat="'+s.id+'" title="'+s.id+' · '+s.type+'">'+s.number+'</div>';
    }).join('');
    return '<div class="grow"><span class="ftag mono">'+rowLabel+'</span><span class="rtype">'+type+'</span><div class="tiles">'+tiles+'</div></div>';
  }).join('');
}
function attemptRebook(show, seat){
  logDivider('— Attempted double-book —');
  logStep('if (seat.getStatus() != SeatStatus.AVAILABLE) throw new SeatNotAvailableException(...);',
    'Seat ' + seat.id + ' is already booked for show ' + show.id + ' → SeatNotAvailableException: "Seat ' + seat.id + ' is already booked for show ' + show.id + '"');
}

// ---------- screens ----------
function screenPickMovie(){
  var el = document.getElementById('stage');
  var cards = SHOWS_META.map(function(m){ return state.shows[m.id]; });
  el.innerHTML = '<h1>Which movie do you want to watch?</h1><p class="stage-cap">Pick a show — it drives the seating chart and base price.</p>'+
    '<div class="choice-row">'+cards.map(function(s){
      return '<button class="choice-btn" data-show="'+s.id+'">'+filmG()+
        '<span class="label">'+esc(s.movie)+'</span>'+
        '<span class="sub">'+esc(s.theaterName)+', '+esc(s.city)+'</span>'+
        '<span class="sub">'+s.startTime+' · base $'+jd(s.basePrice)+'</span></button>';
    }).join('')+'</div>';
  Array.prototype.forEach.call(el.querySelectorAll('[data-show]'), function(btn){
    btn.addEventListener('click', function(){
      var id = btn.getAttribute('data-show'), s = state.shows[id];
      state.current = { showId: id, userId: null, selectedSeats: [] };
      logDivider('— ' + s.movie + ' @ ' + s.city + ' —');
      logStep('List<Show> shows = service.searchShows("'+s.movie+'", "'+s.city+'");',
        'SEARCH found 1 show(s): ' + s.id + ' @ ' + s.theaterName + ' ' + s.startTime);
      logStep('List<Seat> available = service.getAvailableSeats("'+s.id+'");', countsString(id));
      screenSeatsAndBook(id);
    });
  });
}

function screenSeatsAndBook(showId){
  var show = state.shows[showId];
  var el = document.getElementById('stage');
  var selected = state.current.selectedSeats;
  var pickedUser = state.current.userId ? findUser(state.current.userId) : null;
  var bookings = existingBookingsFor(showId);

  el.innerHTML = '<h1>'+esc(show.movie)+'</h1><p class="stage-cap">Tap up to 3 available seats, pick who\'s booking, then confirm.</p>'+
    '<div class="legend">'+legendChips(show)+'</div>'+
    '<div id="grid-preview">'+renderSeatGrid(showId, selected)+'</div>'+
    '<div class="stage-cap" style="margin:14px 0 6px">Who\'s booking?</div>'+
    '<div class="choice-row">'+USERS.map(function(u){
      return '<button class="choice-btn small'+(state.current.userId===u.id?' picked':'')+'" data-user="'+u.id+'"><span class="avatar">'+u.name.charAt(0)+'</span><span class="label">'+u.name+'</span></button>';
    }).join('')+'</div>'+
    (bookings.length ? '<div class="stage-cap" style="margin:14px 0 6px">Confirmed bookings for this show</div><div class="booking-list">'+
      bookings.map(function(b){
        return '<div class="booking-item"><span class="mono">'+b.id+'</span><span>'+esc(b.seatIds.join(', '))+'</span><span class="mono">$'+jd(b.total)+'</span>'+
          '<button class="sip" data-cancel="'+b.id+'">Cancel →</button></div>';
      }).join('')+'</div>' : '')+
    '<div class="actions">'+
      (selected.length && pickedUser
        ? '<button class="cta" id="do-book">Book '+selected.length+' seat'+(selected.length>1?'s':'')+' →</button>'
        : '<span class="stage-cap">Select 1–3 seats and a booker to continue.</span>')+
    '</div>';

  Array.prototype.forEach.call(el.querySelectorAll('.tile'), function(t){
    t.addEventListener('click', function(){
      var id = t.getAttribute('data-seat'), seat = findSeat(show, id);
      if (seat.status === 'BOOKED') { attemptRebook(show, seat); return; }
      var idx = selected.indexOf(id);
      if (idx >= 0) selected.splice(idx, 1);
      else if (selected.length < 3) selected.push(id);
      screenSeatsAndBook(showId);
    });
  });
  Array.prototype.forEach.call(el.querySelectorAll('[data-user]'), function(b){
    b.addEventListener('click', function(){ state.current.userId = b.getAttribute('data-user'); screenSeatsAndBook(showId); });
  });
  Array.prototype.forEach.call(el.querySelectorAll('[data-cancel]'), function(b){
    b.addEventListener('click', function(){
      var id = b.getAttribute('data-cancel');
      logDivider('— Cancelling ' + id + ' —');
      logStep('service.cancelBooking("'+id+'");', 'looking up booking ' + id);
      screenCancelSteps(id);
    });
  });
  var doBook = document.getElementById('do-book');
  if (doBook) doBook.addEventListener('click', function(){
    var user = findUser(state.current.userId), seatIds = selected.slice();
    logDivider('— Booking ' + seatIds.join(', ') + ' for ' + user.name + ' —');
    logStep('service.bookSeats("'+showId+'", "'+user.id+'", "'+user.name+'", "'+user.email+'", ['+seatIds.map(function(s){return '"'+s+'"';}).join(', ')+']);',
      'seatIds requested: ' + seatIds.join(', '));
    screenBookSteps(showId, user, seatIds);
  });
}

// ---------- bookSeats() trace ----------
function buildBookSteps(showId, user, seatIds){
  var show = state.shows[showId], steps = [];

  steps.push({ code: 'Show show = findShow("'+showId+'");',
    detail: show.movie + ' @ ' + show.theaterName + ', base $' + jd(show.basePrice) });

  var existing = state.usersById[user.id];
  if (existing) {
    steps.push({ code: 'User user = usersById.computeIfAbsent("'+user.id+'", id -> new User(...));',
      detail: '"'+user.id+'" already present → returns existing: ' + existing.name + ' (' + existing.email + ')' });
  } else {
    steps.push({ code: 'User user = usersById.computeIfAbsent("'+user.id+'", id -> new User(...));',
      detail: '"'+user.id+'" not present → creates new User: ' + user.name + ' (' + user.email + ')',
      effect: function(){ state.usersById[user.id] = { name: user.name, email: user.email }; } });
  }

  seatIds.forEach(function(id){
    var seat = findSeat(show, id);
    steps.push({ code: 'seat = show.getScreen().getSeat("'+id+'");  // + status check',
      detail: id + ' (' + seat.type + ') status == AVAILABLE ✓ — added to seatsToBook' });
  });

  var total = 0;
  seatIds.forEach(function(id){
    var seat = findSeat(show, id), cls = STRAT_CLASS[seat.type], price = calcPrice(seat.type, show.basePrice);
    total += price;
    var runningTotal = total;
    steps.push({ code: 'pricingStrategy = SeatPricingStrategyFactory.getStrategy('+seat.type+');  // → '+cls,
      detail: cls + '.calculatePrice(' + jd(show.basePrice) + ') = $' + jd(price) + '   (running total $' + jd(runningTotal) + ')',
      effect: function(){ var t = document.getElementById('running-total'); if (t) t.textContent = '$' + jd(runningTotal); } });
  });

  steps.push({ code: 'for (Seat seat : seatsToBook) seat.setStatus(SeatStatus.BOOKED);',
    detail: seatIds.join(', ') + ' → BOOKED',
    effect: function(){ seatIds.forEach(function(id){ findSeat(show, id).status = 'BOOKED'; }); } });

  var bookingId = 'BK' + state.bookingSeq;
  steps.push({ code: 'String bookingId = "BK" + bookingSequence.getAndIncrement();',
    detail: 'bookingSequence ' + state.bookingSeq + ' → ' + (state.bookingSeq + 1) + ', bookingId = "' + bookingId + '"',
    effect: function(){ state.bookingSeq++; } });

  steps.push({ code: 'Booking booking = new Booking(bookingId, show, user, seatsToBook, totalAmount, LocalDateTime.now());',
    detail: 'total=$' + jd(total) + ', status=CONFIRMED' });

  steps.push({ code: 'bookingRepository.save(booking);', detail: 'booking "' + bookingId + '" now tracked',
    effect: function(){
      state.bookings[bookingId] = { id: bookingId, showId: showId, userId: user.id, userName: user.name, userEmail: user.email, seatIds: seatIds.slice(), total: total, status: 'CONFIRMED' };
    } });

  steps.push({ code: 'observer.onBookingConfirmed(booking);  // EmailNotificationObserver',
    detail: 'EMAIL to ' + user.email + ': booking ' + bookingId + ' confirmed for ' + show.movie + ' ($' + jd(total) + ')' });
  steps.push({ code: 'observer.onBookingConfirmed(booking);  // SmsNotificationObserver',
    detail: 'SMS to ' + user.name + ': your seats for ' + show.movie + ' are booked. Booking ' + bookingId + '.' });

  return { steps: steps, bookingId: bookingId };
}

function screenBookSteps(showId, user, seatIds){
  var built = buildBookSteps(showId, user, seatIds), steps = built.steps, idx = 0;
  render();
  function render(){
    var el = document.getElementById('stage');
    el.innerHTML = '<h1>Watch it happen</h1><p class="stage-cap">Tap through the real bookSeats() call chain.</p>'+
      '<div class="fee-num mono" id="running-total">$0.0</div>'+
      '<div id="grid-preview">'+renderSeatGrid(showId, seatIds)+'</div>'+
      '<div class="actions"><button class="cta" id="next-step">Next step →</button></div>';
    document.getElementById('next-step').addEventListener('click', function(){
      var s = steps[idx]; logStep(s.code, s.detail, s.effect); idx++;
      if (idx >= steps.length) { setTimeout(function(){ screenBookingOutcome(built.bookingId); }, 250); } else { render(); }
    });
  }
}

function screenBookingOutcome(bookingId){
  var b = state.bookings[bookingId], show = state.shows[b.showId];
  var el = document.getElementById('stage');
  el.innerHTML = '<h1>Booking confirmed</h1><p class="stage-cap">'+bookingId+' — '+esc(show.movie)+'</p>'+
    '<div class="ticket-stub">'+ticketG()+'<div class="tid mono">'+esc(bookingId)+'</div>'+
    '<div class="row"><span>Movie</span><span class="mono">'+esc(show.movie)+'</span></div>'+
    '<div class="row"><span>Seats</span><span class="mono">'+esc(b.seatIds.join(', '))+'</span></div>'+
    '<div class="row"><span>Total</span><span class="mono">$'+jd(b.total)+'</span></div></div>'+
    '<div class="console-line mono">OK booked ['+esc(b.seatIds.join(', '))+'] -&gt; booking '+esc(bookingId)+' total $'+jd(b.total)+'</div>'+
    '<div id="grid-preview">'+renderSeatGrid(b.showId, b.seatIds)+'</div>'+
    '<div class="actions">'+
      '<button class="cta ghost" id="cancel-it">Cancel this booking →</button>'+
      '<button class="cta" id="book-more">Book more seats ↻</button>'+
      '<button class="sip" id="new-movie">Choose another movie ↻</button>'+
    '</div>';
  document.getElementById('cancel-it').addEventListener('click', function(){
    logDivider('— Cancelling ' + bookingId + ' —');
    logStep('service.cancelBooking("'+bookingId+'");', 'looking up booking ' + bookingId);
    screenCancelSteps(bookingId);
  });
  document.getElementById('book-more').addEventListener('click', function(){
    state.current.selectedSeats = []; state.current.userId = null;
    screenSeatsAndBook(b.showId);
  });
  document.getElementById('new-movie').addEventListener('click', function(){
    state.current = { showId: null, userId: null, selectedSeats: [] };
    screenPickMovie();
  });
}

// ---------- cancelBooking() trace ----------
function buildCancelSteps(bookingId){
  var b = state.bookings[bookingId], show = state.shows[b.showId], steps = [];
  steps.push({ code: 'Booking booking = bookingRepository.findById("'+bookingId+'");', detail: 'found: status=' + b.status });
  steps.push({ code: 'if (booking == null || booking.getStatus() != BookingStatus.CONFIRMED) throw new BookingNotFoundException(...);',
    detail: 'status == CONFIRMED ✓ — proceeds' });
  steps.push({ code: 'for (Seat seat : booking.getSeats()) seat.setStatus(SeatStatus.AVAILABLE);',
    detail: b.seatIds.join(', ') + ' → AVAILABLE again',
    effect: function(){ b.seatIds.forEach(function(id){ findSeat(show, id).status = 'AVAILABLE'; }); } });
  steps.push({ code: 'booking.setStatus(BookingStatus.CANCELLED);', detail: 'status: CONFIRMED → CANCELLED',
    effect: function(){ b.status = 'CANCELLED'; } });
  steps.push({ code: 'observer.onBookingCancelled(booking);  // EmailNotificationObserver',
    detail: 'EMAIL to ' + b.userEmail + ': booking ' + bookingId + ' cancelled, refund $' + jd(b.total) });
  steps.push({ code: 'observer.onBookingCancelled(booking);  // SmsNotificationObserver',
    detail: 'SMS to ' + b.userName + ': booking ' + bookingId + ' has been cancelled.' });
  return steps;
}

function screenCancelSteps(bookingId){
  var b = state.bookings[bookingId];
  var steps = buildCancelSteps(bookingId), idx = 0;
  render();
  function render(){
    var el = document.getElementById('stage');
    el.innerHTML = '<h1>Cancelling '+bookingId+'</h1><p class="stage-cap">Tap through the real cancelBooking() call chain.</p>'+
      '<div id="grid-preview">'+renderSeatGrid(b.showId, b.seatIds)+'</div>'+
      '<div class="actions"><button class="cta" id="next-step">Next step →</button></div>';
    document.getElementById('next-step').addEventListener('click', function(){
      var s = steps[idx]; logStep(s.code, s.detail, s.effect); idx++;
      if (idx >= steps.length) { setTimeout(function(){ screenCancelOutcome(bookingId); }, 250); } else { render(); }
    });
  }
}

function screenCancelOutcome(bookingId){
  var b = state.bookings[bookingId], show = state.shows[b.showId];
  var el = document.getElementById('stage');
  el.innerHTML = '<h1>Booking cancelled</h1><p class="stage-cap">'+bookingId+' — seats freed, refund issued</p>'+

    '<div class="row"><span>Movie</span><span class="mono">'+esc(show.movie)+'</span></div>'+
    '<div class="row"><span>Seats freed</span><span class="mono">'+esc(b.seatIds.join(', '))+'</span></div>'+
    '<div class="row"><span>Refund</span><span class="mono">$'+jd(b.total)+'</span></div></div>'+
    '<div class="console-line mono">OK cancelled booking '+esc(bookingId)+'</div>'+
    '<div id="grid-preview">'+renderSeatGrid(b.showId, [])+'</div>'+
    '<div class="actions">'+
      '<button class="cta" id="book-again">Book another ↻</button>'+
      '<button class="sip" id="new-movie">Choose another movie ↻</button>'+
    '</div>';
  document.getElementById('book-again').addEventListener('click', function(){
    state.current.selectedSeats = []; state.current.userId = null;
    screenSeatsAndBook(b.showId);
  });
  document.getElementById('new-movie').addEventListener('click', function(){
    state.current = { showId: null, userId: null, selectedSeats: [] };
    screenPickMovie();
  });
}

screenPickMovie();
})();
